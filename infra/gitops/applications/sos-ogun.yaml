# ArgoCD Application for the ogun state tenant (Tier 2 — Hybrid Industrial).
# Kustomize overlay: infra/k8s/overlays/hybrid-tier + sos-platform Helm release
# with tenant values. Automated sync with prune + selfHeal; namespace created
# declaratively by the k8s overlay.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sos-ogun
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/tenant-state: ogun
    sos.gov.ng/tenancy-tier: hybrid
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sos-states
  sources:
    - repoURL: https://github.com/munisp/unified-sos.git
      targetRevision: main
      path: infra/k8s/overlays/hybrid-tier
    - repoURL: https://github.com/munisp/unified-sos.git
      targetRevision: main
      path: infra/helm/sos-platform
      helm:
        valueFiles:
          - values.yaml
        values: |
          global:
            tenantStateId: ogun
            tenancyTier: hybrid
            postgresHost: sos-postgres-ogun.sos-ogun
            policyPackPath: config/states/ogun/policy-pack.json
  destination:
    server: https://kubernetes.default.svc
    namespace: sos-ogun
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
