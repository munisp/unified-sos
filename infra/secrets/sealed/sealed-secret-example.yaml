# SealedSecret example (Bitnami sealed-secrets pattern).
#
# `encryptedData` values are ciphertext produced by:
#   kubeseal --controller-namespace sealed-secrets --format yaml < plain.yaml
# They can only be decrypted by the target cluster's controller key, so
# committing them is safe. The blobs below are non-functional placeholder
# ciphertext — regenerate per cluster/rotation with kubeseal.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: sos-secrets-telco
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  encryptedData:
    CITIZEN_PORTAL_TELCO_SECRET: placeholder-sealed-ciphertext-regenerate-with-kubeseal
    TELCO_SECRET_HEADER: placeholder-sealed-ciphertext-regenerate-with-kubeseal
  template:
    metadata:
      name: sos-secrets-telco
      namespace: sos-platform
