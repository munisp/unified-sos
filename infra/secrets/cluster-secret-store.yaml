# ClusterSecretStore for the SOS platform secret backend.
# Reference backend: HashiCorp Vault (matches KMS_VAULT_* used by the
# control plane). No credentials are committed: the controller
# authenticates with a Kubernetes service account via Vault's kubernetes
# auth method; the token referenced below is created and owned by the
# external-secrets operator installation, not by this repo.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: sos-vault
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  provider:
    vault:
      # Injected at deploy time by the platform overlay; never a literal.
      server: "https://vault.sos-platform.svc:8200"
      path: "sos"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-operator"
          serviceAccountRef:
            name: "external-secrets-operator"
            namespace: "external-secrets"
