# ExternalSecret: sos-secrets-kms — Envelope-encryption backend wiring (Vault transit)
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-kms
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-kms
    creationPolicy: Owner
  data:
    - secretKey: KMS_BACKEND
      remoteRef:
        key: kms/vault
        property: KMS_BACKEND
    - secretKey: KMS_VAULT_ADDR
      remoteRef:
        key: kms/vault
        property: KMS_VAULT_ADDR
    - secretKey: KMS_VAULT_TOKEN
      remoteRef:
        key: kms/vault
        property: KMS_VAULT_TOKEN

