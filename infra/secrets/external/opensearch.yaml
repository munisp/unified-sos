# ExternalSecret: sos-secrets-opensearch — OpenSearch audit archive + snapshot repository access
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-opensearch
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-opensearch
    creationPolicy: Owner
  data:
    - secretKey: OPENSEARCH_URL
      remoteRef:
        key: audit/opensearch
        property: OPENSEARCH_URL
    - secretKey: OPENSEARCH_USER
      remoteRef:
        key: audit/opensearch
        property: OPENSEARCH_USER
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: audit/opensearch
        property: OPENSEARCH_PASSWORD

