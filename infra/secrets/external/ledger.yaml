# ExternalSecret: sos-secrets-ledger — TigerBeetle cluster wiring for ledger clients
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-ledger
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-ledger
    creationPolicy: Owner
  data:
    - secretKey: TB_ADDRESSES
      remoteRef:
        key: ledger/tigerbeetle
        property: TB_ADDRESSES
    - secretKey: TB_CLUSTER_ID
      remoteRef:
        key: ledger/tigerbeetle
        property: TB_CLUSTER_ID

