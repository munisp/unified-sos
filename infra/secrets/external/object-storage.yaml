# ExternalSecret: sos-secrets-storage — MinIO/S3 + SSE-KMS for backups, lakehouse, and WORM snapshots
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-storage
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-storage
    creationPolicy: Owner
  data:
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: storage/s3
        property: S3_ENDPOINT_URL
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: storage/s3
        property: S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: storage/s3
        property: S3_SECRET_ACCESS_KEY
    - secretKey: S3_KMS_KEY_ID
      remoteRef:
        key: storage/s3
        property: S3_KMS_KEY_ID
    - secretKey: SOS_BACKUP_S3_BUCKET
      remoteRef:
        key: storage/s3
        property: SOS_BACKUP_S3_BUCKET

