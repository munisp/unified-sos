# ExternalSecret: sos-secrets-kyc — NIMC/CAC live registry credentials (mod-kyc-kyb, KYC_REGISTRY_MODE=live)
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-kyc
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-kyc
    creationPolicy: Owner
  data:
    - secretKey: NIMC_BASE_URL
      remoteRef:
        key: registries/kyc
        property: NIMC_BASE_URL
    - secretKey: NIMC_CLIENT_ID
      remoteRef:
        key: registries/kyc
        property: NIMC_CLIENT_ID
    - secretKey: NIMC_CLIENT_SECRET
      remoteRef:
        key: registries/kyc
        property: NIMC_CLIENT_SECRET
    - secretKey: NIMC_MTLS_CERT
      remoteRef:
        key: registries/kyc
        property: NIMC_MTLS_CERT
    - secretKey: NIMC_MTLS_KEY
      remoteRef:
        key: registries/kyc
        property: NIMC_MTLS_KEY
    - secretKey: CAC_BASE_URL
      remoteRef:
        key: registries/kyc
        property: CAC_BASE_URL
    - secretKey: CAC_CLIENT_ID
      remoteRef:
        key: registries/kyc
        property: CAC_CLIENT_ID
    - secretKey: CAC_CLIENT_SECRET
      remoteRef:
        key: registries/kyc
        property: CAC_CLIENT_SECRET
    - secretKey: CAC_MTLS_CERT
      remoteRef:
        key: registries/kyc
        property: CAC_MTLS_CERT
    - secretKey: CAC_MTLS_KEY
      remoteRef:
        key: registries/kyc
        property: CAC_MTLS_KEY

