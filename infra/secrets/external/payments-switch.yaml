# ExternalSecret: sos-secrets-payments — NIBSS e-Bills + FSPIOP/Mojaloop scheme credentials (mod-mobility-switch)
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-payments
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-payments
    creationPolicy: Owner
  data:
    - secretKey: NIBSS_CLIENT_ID
      remoteRef:
        key: payments/switch
        property: NIBSS_CLIENT_ID
    - secretKey: NIBSS_CLIENT_SECRET
      remoteRef:
        key: payments/switch
        property: NIBSS_CLIENT_SECRET
    - secretKey: FSPIOP_CALLBACK_SECRET
      remoteRef:
        key: payments/switch
        property: FSPIOP_CALLBACK_SECRET
    - secretKey: FSPIOP_JWS_SIGNING_KEY
      remoteRef:
        key: payments/switch
        property: FSPIOP_JWS_SIGNING_KEY

