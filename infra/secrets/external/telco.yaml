# ExternalSecret: sos-secrets-telco — USSD/IVR telco webhook shared secret (mod-citizen-portal)
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-telco
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-telco
    creationPolicy: Owner
  data:
    - secretKey: CITIZEN_PORTAL_TELCO_SECRET
      remoteRef:
        key: channels/telco
        property: CITIZEN_PORTAL_TELCO_SECRET
    - secretKey: TELCO_SECRET_HEADER
      remoteRef:
        key: channels/telco
        property: TELCO_SECRET_HEADER

