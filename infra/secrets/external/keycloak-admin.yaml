# ExternalSecret: sos-secrets-keycloak — Keycloak admin API access (realm management, control plane)
# Materialises a Kubernetes Secret from the `sos-vault` ClusterSecretStore.
# No plaintext values are committed: only remote key references.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sos-secrets-keycloak
  namespace: sos-platform
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/component: secrets-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sos-vault
  target:
    name: sos-secrets-keycloak
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_ADMIN_URL
      remoteRef:
        key: identity/keycloak-admin
        property: KEYCLOAK_ADMIN_URL
    - secretKey: KEYCLOAK_ADMIN_USER
      remoteRef:
        key: identity/keycloak-admin
        property: KEYCLOAK_ADMIN_USER
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: identity/keycloak-admin
        property: KEYCLOAK_ADMIN_PASSWORD

