apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tier 1 — Dedicated Sovereign overlay (Lagos).
# Fully dedicated cluster: standalone Postgres/Patroni, standalone TigerBeetle
# cluster on NVMe, dedicated MinIO buckets, isolated VPC. This overlay must
# NEVER reference shared data-plane resources (enforced by
# infra/tests/validate_infra.py).

commonLabels:
  sos.gov.ng/tenancy-tier: dedicated

resources:
  - ../../base
  - states/lagos.yaml
