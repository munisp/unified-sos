# Tier 3 tenant data plane for Osun State (schema-isolated on the shared cluster).
apiVersion: v1
kind: Namespace
metadata:
  name: sos-osun
  labels:
    app.kubernetes.io/part-of: sos-platform
    sos.gov.ng/tenant-state: osun
    sos.gov.ng/tenancy-tier: shared
    pod-security.kubernetes.io/enforce: restricted
---
# Pro-rata cost allocation is metered by Kubecost against this quota.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sos-osun-quota
  namespace: sos-osun
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "120"
    persistentvolumeclaims: "10"
    services.loadbalancers: "0"
---
# Tenant isolation: Osun workloads may only talk to their own namespace,
# to labelled platform components (APISIX gateway / Keycloak / control plane)
# and to cluster DNS. All cross-state egress is denied by omission.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sos-osun-tenant-isolation
  namespace: sos-osun
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              sos.gov.ng/tenant-state: osun
        - namespaceSelector:
            matchLabels:
              sos.gov.ng/platform-component: "true"
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              sos.gov.ng/tenant-state: osun
    - to:
        - namespaceSelector:
            matchLabels:
              sos.gov.ng/platform-component: "true"
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# RLS-enforcing Postgres notes for the Osun tenant.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sos-osun-postgres-tenancy
  namespace: sos-osun
  labels:
    sos.gov.ng/tenant-state: osun
data:
  TENANCY_NOTES.md: |
    # Osun — Tier 3 Shared Postgres Tenancy
    - Cluster: `sos-postgres-shared.sos-data` (HA Patroni, shared with the
      other Tier-3 states).
    - Isolation unit: dedicated schema `osun.*`; no Osun table lives outside it.
    - Row-Level Security is MANDATORY on every tenant table:
      `CREATE POLICY tenant_isolation ON <table>
       USING (tenant_state_id = current_setting('app.current_state_tenant'));`
      (reference DDL: `db/migrations/0001_cadastre.sql`).
    - Dapr / the service mesh injects `app.current_state_tenant=osun` per
      connection after Keycloak realm (`sos-osun`) token validation; the
      application role is not a superuser and cannot bypass RLS.
    - Connection pooling via PgBouncer with per-tenant user `sos_osun_app`.
    - TigerBeetle: shared 6-node cluster, partition keyed on state tenant ID
      0x0003 (see `ledger/chart-of-accounts.md`).
    - Kubecost: costs allocated pro-rata to the `sos-osun` namespace.
---
# TigerBeetle ledger wiring for the Osun tenant (ADR-002 / Clause 22.2).
# mod-rev-core consumes these as REV_CORE_LEDGER=tigerbeetle + TB_ADDRESSES /
# TB_CLUSTER_ID (fail-closed when unset).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sos-osun-ledger
  namespace: sos-osun
  labels:
    sos.gov.ng/tenant-state: osun
data:
  TB_ADDRESSES: "sos-shared-tier3-tigerbeetle-client.sos-data:3000"
  TB_CLUSTER_ID: "1"
  LEDGER_TENANCY_NOTES.md: |
    # Osun — TigerBeetle ledger plane
    - Tier 3 Shared: shared 3-replica TigerBeetle VSR cluster; logical partition keyed on state tenant ID.
    - Ledger ID: 1 (NG State Sovereign Ledger); state tenant ID 0x0003 in
      account ID bits 0..15 (see `ledger/chart-of-accounts.md`).
    - Replicas: 3 (odd, >= 3 for VSR quorum), per-replica NVMe PVCs —
      no hostPath; provisioned via infra/terraform/modules/tigerbeetle or the
      sos-platform Helm chart (`tigerbeetle.*` values).
    - Bootstrap: `sosctl ledger init --state=osun` (dry-run by default).
