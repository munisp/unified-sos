# Allow DNS resolution for platform pods (kube-system/kube-dns is labelled
# kubernetes.io/metadata.name=kube-system by default on Kubernetes >= 1.21).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sos-platform-allow-dns
  namespace: sos-platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
