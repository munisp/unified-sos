apiVersion: v1
kind: Service
metadata:
  name: geolibre
  namespace: {{ .Values.namespace | default "sos-platform" }}
  labels:
    app.kubernetes.io/name: geolibre
    app.kubernetes.io/component: workbench
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: geolibre
  ports:
    - name: http
      port: {{ .Values.service.port | default 8085 }}
      targetPort: http
