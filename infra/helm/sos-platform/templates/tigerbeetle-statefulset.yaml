{{- if .Values.tigerbeetle.enabled }}
# TigerBeetle VSR consensus cluster (ADR-002 / Clause 22.2).
# Odd replica count (>=3) for quorum; one PVC per replica (no hostPath —
# ledger data must follow the pod); headless Service for the replica
# mesh and an internal-only Service for clients (mod-rev-core).
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "sos-platform.fullname" . }}-tigerbeetle-headless"
  labels:
    app.kubernetes.io/component: tigerbeetle
{{ include "sos-platform.labels" . | indent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: tigerbeetle
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: replication
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "sos-platform.fullname" . }}-tigerbeetle"
  labels:
    app.kubernetes.io/component: tigerbeetle
{{ include "sos-platform.labels" . | indent 4 }}
spec:
  type: ClusterIP # internal only — never exposed outside the VPC
  selector:
    app.kubernetes.io/component: tigerbeetle
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: client
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "{{ include "sos-platform.fullname" . }}-tigerbeetle"
  labels:
    app.kubernetes.io/component: tigerbeetle
{{ include "sos-platform.labels" . | indent 4 }}
spec:
  serviceName: "{{ include "sos-platform.fullname" . }}-tigerbeetle-headless"
  replicas: {{ .Values.tigerbeetle.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: tigerbeetle
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tigerbeetle
        app.kubernetes.io/instance: {{ .Release.Name }}
        sos.gov.ng/tenant-state: {{ .Values.global.tenantStateId }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: tigerbeetle
          image: "{{ .Values.tigerbeetle.image.repository }}:{{ .Values.tigerbeetle.image.tag }}"
          ports:
            - name: replication
              containerPort: 3000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh", "-c"]
          args:
            - >-
              REPLICA=$(echo $POD_NAME | sed 's/.*-//') &&
              /tigerbeetle start
              --cluster={{ .Values.tigerbeetle.clusterId }}
              --replica=$REPLICA
              --replica-count={{ .Values.tigerbeetle.replicaCount }}
              --addresses='{{ include "sos-platform.tigerbeetleAddresses" . }}'
              /data/tigerbeetle.tigerbeetle
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
{{ toYaml .Values.tigerbeetle.resources | indent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.tigerbeetle.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.tigerbeetle.storageSize | quote }}
{{- end }}
