{{- if .Values.modRevCore.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "sos-platform.fullname" . }}-mod-rev-core"
  labels:
    app.kubernetes.io/component: mod-rev-core
{{ include "sos-platform.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.modRevCore.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: mod-rev-core
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
