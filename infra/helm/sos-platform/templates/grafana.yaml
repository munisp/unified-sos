{{- /*
Stage 7.C: Grafana for the SOS platform (values-gated, off by default).
Pre-provisions the Prometheus datasource (in-cluster service above) and the
RED dashboard. Admin credentials come from a pre-created Secret referenced
by .Values.grafana.adminSecretName.
*/ -}}
{{- if .Values.grafana.enabled }}
{{- $fullname := include "sos-platform.fullname" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ $fullname }}-grafana-provisioning"
  labels:
    app.kubernetes.io/component: grafana
{{ include "sos-platform.labels" . | indent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: "http://{{ $fullname }}-prometheus:{{ .Values.prometheus.service.port }}"
        isDefault: true
  dashboard-providers.yaml: |
    apiVersion: 1
    providers:
      - name: sos
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $fullname }}-grafana"
  labels:
    app.kubernetes.io/component: grafana
{{ include "sos-platform.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.adminSecretName }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.adminSecretName }}
                  key: admin-password
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard-providers.yaml
              subPath: dashboard-providers.yaml
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
{{ toYaml .Values.grafana.resources | indent 12 }}
      volumes:
        - name: provisioning
          configMap:
            name: "{{ $fullname }}-grafana-provisioning"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ $fullname }}-grafana"
  labels:
    app.kubernetes.io/component: grafana
{{ include "sos-platform.labels" . | indent 4 }}
spec:
  selector:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
{{- end }}
