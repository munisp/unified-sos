{{- if .Values.apisix.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "sos-platform.fullname" . }}-apisix"
  labels:
    app.kubernetes.io/component: api-gateway
{{ include "sos-platform.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.apisix.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        sos.gov.ng/tenant-state: {{ .Values.global.tenantStateId }}
    spec:
      containers:
        - name: apisix
          image: "{{ .Values.apisix.image.repository }}:{{ .Values.apisix.image.tag }}"
          ports:
            - name: http
              containerPort: 9080
            - name: https
              containerPort: 9443
          env:
            - name: SOS_TENANT_STATE
              value: {{ .Values.global.tenantStateId | quote }}
            - name: SOS_KEYCLOAK_REALM
              value: {{ include "sos-platform.realm" . | quote }}
          resources:
{{ toYaml .Values.apisix.resources | indent 12 }}
{{- end }}
