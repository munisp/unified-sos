{{- if and .Values.keycloak.enabled .Values.keycloak.realmImport.enabled }}
# ConfigMap consumed by the keycloak-realm-import Job (see
# keycloak-realm-import-job.yaml). Carries the rendered realm JSON for THIS
# state tenant only, selected from the chart-bundled copies of
# deploy/keycloak/realms/ via .Values.global.tenantStateId. Realm JSONs are
# generated by deploy/keycloak/render_realms.py — do not hand-edit the
# bundled copies under infra/helm/sos-platform/realms/.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.keycloak.realmImport.realmsConfigMap }}
  labels:
    app.kubernetes.io/component: iam
{{ include "sos-platform.labels" . | indent 4 }}
data:
  "{{ include "sos-platform.realm" . }}-realm.json": |
{{ .Files.Get (printf "realms/%s.json" (include "sos-platform.realm" .)) | indent 4 }}
{{- end }}
