tigerbeetle:
  enabled: true
  # VSR quorum: odd count >= 3 (dedicated tier: 5, hybrid/shared: 3)
  replicaCount: 3
  # 1 = NG State Sovereign Ledger (ledger/chart-of-accounts.md)
  clusterId: 1
  image:
    repository: ghcr.io/tigerbeetle/tigerbeetle
    tag: "0.16.11" # Apache-2.0
  # NVMe-backed StorageClass; ledger data lives on per-replica PVCs
  # (volumeClaimTemplates) — hostPath is forbidden.
  storageClass: sos-nvme
  storageSize: 100Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

kubecost:
  enabled: true
  image:
    repository: gcr.io/kubecost1/cost-model
    tag: "2.5.2" # Apache-2.0 core
  service:
    port: 9090
  # Label used for per-tenant pro-rata allocation
  tenantLabel: sos.gov.ng/tenant-state

keda:
  enabled: true
  scaledObject:
    minReplicaCount: 2
    maxReplicaCount: 20
    pollingInterval: 15
    cooldownPeriod: 300
    # Kafka queue-depth driven scaling (per docs/architecture blueprint)
    kafka:
      bootstrapServers: kafka.sos-data:9092
      topic: ng.sos.revenue.assessments
      consumerGroup: mod-rev-core
      lagThreshold: "1000"

# Stage 7.C observability stack (values-gated, off by default).
# When enabled, renders an in-cluster Prometheus scraping every enabled
# module's /metrics endpoint plus Grafana with the RED dashboard
# (deploy/observability/). Alert rules come from deploy/observability/alerts.yml.
prometheus:
  enabled: false
  image:
    repository: prom/prometheus
    tag: "v2.54.1" # Apache-2.0
  service:
    port: 9090
  retention: 15d
  resources: {}

grafana:
  enabled: false
  image:
    repository: grafana/grafana
    tag: "11.2.2" # AGPL-3.0
  service:
    port: 3000
  # Admin credentials come from this pre-created Secret (keys: admin-user,
  # admin-password). Never commit credentials to values.
  adminSecretName: sos-grafana-admin
  resources: {}
