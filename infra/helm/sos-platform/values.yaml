# SOS platform umbrella values — one release per state tenant.
# State variation belongs in config/states/<state>/ policy packs (80/20 rule);
# this chart only carries tenant identity + sizing knobs.

global:
  # One of: lagos | ogun | osun | benue | nasarawa | taraba
  tenantStateId: osun
  # One of: dedicated | hybrid | shared (must match infra/k8s/overlays/)
  tenancyTier: shared
  domain: sos.gov.ng
  # Keycloak realm for this tenant; empty means "sos-<tenantStateId>"
  keycloakRealm: ""
  # Postgres host for this tier — shared cluster for Tier 3, dedicated for
  # Tier 1/2. Injected per-tenant by the ArgoCD Application.
  postgresHost: sos-postgres-shared.sos-data
  policyPackPath: config/states/osun/policy-pack.json

apisix:
  enabled: true
  replicaCount: 2
  image:
    repository: apache/apisix
    tag: "3.9.1-debian" # Apache-2.0
  service:
    type: ClusterIP
    port: 80
  tls:
    # TLS 1.3 termination; certificate issued per-state via cert-manager/OpenBao
    secretName: sos-gateway-tls
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0" # Apache-2.0
  realmImport:
    enabled: true
    # ConfigMap holding realm JSON rendered from config/states/<state>/
    realmsConfigMap: sos-keycloak-realms
    backoffLimit: 3

# SOS module services (services/mod-*, control-plane, lakehouse).
