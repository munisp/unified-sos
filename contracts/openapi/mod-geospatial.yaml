info:
  title: SOS Geospatial Orchestration, GeoLibre Projects & Lakehouse API (mod-geospatial)
  version: 0.1.0
  description: 'Stage 5 / GEO-LND · Lots 4-6. Tenant-isolated geospatial dataset registration (PostGIS system of record),
    H3 indexing, deterministic processing jobs, GeoLibre self-hosted workbench project authoring (.geolibre.json artifacts;
    never the system of record; no raw PII or hosted share/collab endpoints), and lakehouse GeoParquet publication seams (Sedona
    analytical engine). Rust geometry-rs provides deterministic WKT validation; mod-geospatial-gateway (Go) provides the low-latency
    validation/command edge. Deploys: all 6 states.'
