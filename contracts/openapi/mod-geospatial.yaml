components:
  schemas:
    DatasetIn:
      properties:
        dataset_type:
          $ref: '#/components/schemas/DatasetType'
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        source_uri:
          type: string
          minLength: 1
          title: Source Uri
        crs:
          type: string
          title: Crs
          default: EPSG:4326
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
          default: INTERNAL
        h3_resolution:
          type: integer
          maximum: 15.0
          minimum: 0.0
          title: H3 Resolution
          default: 9
        geometry:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Geometry
        bbox:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Bbox
      type: object
      required:
      - dataset_type
      - name
      - source_uri
      title: DatasetIn
    DatasetType:
      type: string
      enum:
      - CADASTRE
      - BUILDING_FOOTPRINTS
      - NDVI_ALERTS
      - FOREST_RESERVES
      - TRANSPORT_CORRIDORS
      - MARKET_BOUNDARIES
      - MINING_SITES
      title: DatasetType
    H3IndexIn:
      properties:
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
        resolution:
          type: integer
          maximum: 15.0
          minimum: 0.0
          title: Resolution
          default: 9
      type: object
      required:
      - geometry
      title: H3IndexIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobIn:
      properties:
        job_type:
          $ref: '#/components/schemas/JobType'
        input_dataset_ids:
          items:
            type: string
          type: array
          title: Input Dataset Ids
        parameters:
          additionalProperties: true
          type: object
          title: Parameters
      type: object
      required:
      - job_type
      title: JobIn
    JobType:
      type: string
      enum:
      - UNASSESSED_PROPERTY_JOIN
      - NDVI_CHANGE_DETECTION
      - H3_AGGREGATION
      - GEOPARQUET_EXPORT
      - GEOLIBRE_PROJECT_BUILD
      title: JobType
    ProjectIn:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        dataset_ids:
          items:
            type: string
          type: array
          title: Dataset Ids
        source_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Job Id
      type: object
      required:
      - name
      title: ProjectIn
    Sensitivity:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
      - SENSITIVE
      title: Sensitivity
      description: 'Sensitivity governs audit redaction: SENSITIVE datasets never emit raw

        geometry or landowner attributes into audit entries or project payloads.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: https://api.{state}.gov.ng/sos
  description: Per-state sovereign data plane (state = lagos|ogun|osun|benue|nasarawa|taraba)
tags:
