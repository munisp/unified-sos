        required: true
        schema:
          type: string
          title: State
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Branding'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branding'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - control-plane
      security:
      - bearerAuth: []
