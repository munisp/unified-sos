        camera_id:
          type: string
          title: Camera Id
        tenant_state_id:
          type: string
          title: Tenant State Id
        name:
          type: string
          title: Name
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
        stream_uri:
          type: string
          title: Stream Uri
        capabilities:
          items:
            type: string
          type: array
          title: Capabilities
          description: e.g. ['face', 'crowd', 'anomaly']
        crowd_density_threshold:
