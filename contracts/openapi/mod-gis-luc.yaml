info:
  title: SOS Land Use Charge Valuation API (mod-gis-luc)
  version: 1.0.0
  description: 'WP-06 / EPIC-06 · Lot 4 · RT-03. Automated Land Use Charge calculation: Sedona satellite building footprints
    matched to cadastral parcels, AI property valuation (Ray AVM, >92% R² vs certified surveyor valuations), automated LUC
    bill issuance. Deploys: Ogun, Benue, Lagos, Nasarawa.'
