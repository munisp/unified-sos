              schema:
                $ref: '#/components/schemas/ValuationRunSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - luc
      security:
      - bearerAuth: []
    get:
      summary: List Valuation Runs
      operationId: list_valuation_runs_api_v1_states__state_id__luc_valuation_runs_get
