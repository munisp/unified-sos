info:
  title: SOS Tertiary Consolidated Billing & Bursary API (mod-education)
  version: 0.1.0
  description: 'WP-11 / EPIC-13 · Lot 7 · RT-04. Unifies tuition, departmental levies, and accommodation fees across state
