  /education/v1/students/{student_id}/billing:
    get:
      summary: Billing Portal
      description: 'Student billing portal view: invoices + outstanding + lock status.'
      operationId: billing_portal_education_v1_students__student_id__billing_get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - education
      security:
      - bearerAuth: []
  /education/v1/invoices/{invoice_id}/pay:
    post:
      summary: Pay Invoice
      operationId: pay_invoice_education_v1_invoices__invoice_id__pay_post
      parameters:
      - name: invoice_id
        in: path
        required: true
        schema:
          type: string
          title: Invoice Id
      responses:
