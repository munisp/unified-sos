              schema:
                $ref: '#/components/schemas/Student'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - education
      security:
      - bearerAuth: []
  /education/v1/invoices:
