      security:
      - bearerAuth: []
  /education/v1/registrations:
    post:
      summary: Register
      description: Course registration — locked (HTTP 423) while fees are outstanding.
      operationId: register_education_v1_registrations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - education
      security:
      - bearerAuth: []
  /education/v1/webhooks/mojaloop:
    post:
      summary: Mojaloop Webhook
      description: 'Mojaloop clearing webhook. Adapter mode: FSPIOP PUT /transfers/{id}
        fulfilment (TransferFulfilmentWebhook) with FSPIOP-Signature header verification
        and COMMITTED transfer state required. Local mode (no adapter wired): deterministic
        stub payload (MojaloopWebhook).'
      operationId: mojaloop_webhook_education_v1_webhooks_mojaloop_post
      parameters:
      - name: FSPIOP-Signature
        in: header
        required: false
        description: 'Adapter mode only: JWS (production) or HMAC-SHA256 (sim
          profile, ''sha256=<hex>'') over the raw request body. Fail closed:
          missing/invalid → 401.'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/TransferFulfilmentWebhook'
              - $ref: '#/components/schemas/MojaloopWebhook'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentInvoice'
        '401':
          description: Missing or invalid FSPIOP-Signature (adapter mode)
        '409':
          description: Transfer not COMMITTED (adapter mode)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - education
      security:
      - bearerAuth: []
