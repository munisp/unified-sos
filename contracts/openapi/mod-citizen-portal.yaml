components:
  schemas:
    AdvanceRequest:
      properties:
        state_id:
          type: string
          title: State Id
        to_status:
          $ref: '#/components/schemas/RequestStatus'
        note:
          type: string
          title: Note
          default: ''
      type: object
      required:
      - state_id
      - to_status
      title: AdvanceRequest
    BiometricVerification:
      properties:
        verification_id:
          type: string
          title: Verification Id
        state_id:
          type: string
          title: State Id
        employee_no:
          type: string
          title: Employee No
        liveness_passed:
          type: boolean
          title: Liveness Passed
        verified:
          type: boolean
          title: Verified
        verified_at:
          type: string
          format: date-time
          title: Verified At
      type: object
      required:
      - verification_id
      - state_id
      - employee_no
      - liveness_passed
      - verified
      title: BiometricVerification
      description: Proof-of-liveness / verification result; no raw biometric data.
    BiometricVerificationCreate:
      properties:
        state_id:
          type: string
          title: State Id
        employee_no:
          type: string
          title: Employee No
        liveness_passed:
          type: boolean
          title: Liveness Passed
        verified:
          type: boolean
          title: Verified
      type: object
      required:
      - state_id
      - employee_no
      - liveness_passed
      - verified
      title: BiometricVerificationCreate
    CivilServant:
      properties:
        employee_no:
          type: string
          title: Employee No
        state_id:
          type: string
          title: State Id
        full_name:
          type: string
          title: Full Name
        mda:
          type: string
          title: Mda
        grade_band:
          type: string
          title: Grade Band
        salary_kobo:
          type: integer
          minimum: 0.0
          title: Salary Kobo
        biometric_template_hash:
          type: string
          title: Biometric Template Hash
        bank_account_hash:
          type: string
          title: Bank Account Hash
        status:
          $ref: '#/components/schemas/ServantStatus'
          default: ACTIVE
        registered_at:
          type: string
          format: date-time
          title: Registered At
      type: object
      required:
      - employee_no
      - state_id
      - full_name
      - mda
      - grade_band
      - salary_kobo
      - biometric_template_hash
      - bank_account_hash
      title: CivilServant
      description: Civil-service payroll record. Hashes only — no raw biometrics.
    GhostRule:
      type: string
      enum:
      - UNVERIFIED_BIOMETRIC
      - DUPLICATE_BIOMETRIC
      - DUPLICATE_SALARY_ACCOUNT
      - INACTIVE_STILL_PAID
      title: GhostRule
      description: Deterministic ghost-worker detection rules.
    GhostWorkerFinding:
      properties:
        finding_id:
          type: string
          title: Finding Id
        state_id:
          type: string
          title: State Id
        rule:
          $ref: '#/components/schemas/GhostRule'
        employee_nos:
          items:
            type: string
          type: array
          title: Employee Nos
        recoverable_kobo:
          type: integer
          minimum: 0.0
          title: Recoverable Kobo
        detail:
          type: string
          title: Detail
          default: ''
      type: object
      required:
      - finding_id
      - state_id
      - rule
      - employee_nos
      - recoverable_kobo
      title: GhostWorkerFinding
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PayrollAudit:
      properties:
        audit_id:
          type: string
          title: Audit Id
        state_id:
          type: string
          title: State Id
        run_at:
          type: string
          format: date-time
          title: Run At
        findings:
          items:
            $ref: '#/components/schemas/GhostWorkerFinding'
          type: array
          title: Findings
        total_recoverable_kobo:
          type: integer
          title: Total Recoverable Kobo
          default: 0
        temporal_workflow:
          anyOf:
          - $ref: '#/components/schemas/TemporalWorkflowRef'
          - type: 'null'
      type: object
      required:
      - audit_id
      - state_id
      title: PayrollAudit
      description: One deterministic ghost-worker audit run over a state's payroll.
    PayrollAuditCreate:
      properties:
        state_id:
          type: string
          title: State Id
      type: object
      required:
      - state_id
      title: PayrollAuditCreate
    Petition:
      properties:
        petition_id:
          type: string
          title: Petition Id
        reference_id:
          type: string
          title: Reference Id
          description: public reference, e.g. PET-LAGOS-000001
        state_id:
          type: string
          title: State Id
        wallet_id:
          type: string
          title: Wallet Id
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
        status:
          $ref: '#/components/schemas/PetitionStatus'
          default: SUBMITTED
        timeline:
          items:
            $ref: '#/components/schemas/StatusEvent'
          type: array
          title: Timeline
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - petition_id
      - reference_id
      - state_id
      - wallet_id
      - title
      - body
      title: Petition
      description: E-petition intake + workflow; ``reference_id`` is the public handle.
    PetitionAdvance:
      properties:
        state_id:
          type: string
          title: State Id
        to_status:
          $ref: '#/components/schemas/PetitionStatus'
        note:
          type: string
          title: Note
          default: ''
      type: object
      required:
      - state_id
      - to_status
      title: PetitionAdvance
    PetitionCreate:
      properties:
        state_id:
          type: string
          title: State Id
        wallet_id:
          type: string
          title: Wallet Id
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
      type: object
      required:
      - state_id
      - wallet_id
      - title
      - body
      title: PetitionCreate
    PetitionStatus:
      type: string
      enum:
      - SUBMITTED
      - UNDER_REVIEW
      - RESOLVED
      - REJECTED
      title: PetitionStatus
    Priority:
      type: string
      enum:
      - STANDARD
      - EXPEDITED
      title: Priority
    RequestStatus:
      type: string
      enum:
      - SUBMITTED
      - IN_REVIEW
      - APPROVED
      - REJECTED
      - COMPLETED
      title: RequestStatus
    ServantStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - RETIRED
      - SUSPENDED
      title: ServantStatus
    ServiceCatalogEntry:
      properties:
        service_code:
          type: string
          title: Service Code
        state_id:
          type: string
          title: State Id
        name:
          type: string
          title: Name
        category:
          $ref: '#/components/schemas/ServiceCategory'
        mda:
          type: string
          title: Mda
        base_fee_kobo:
          type: integer
          title: Base Fee Kobo
          default: 0
        expedited_fee_kobo:
          type: integer
          title: Expedited Fee Kobo
          default: 0
        sla_days:
          type: integer
          title: Sla Days
          default: 14
        active:
          type: boolean
          title: Active
          default: true
        module:
          type: string
          title: Module
          description: owning SOS module, e.g. mod-mining
          default: ''
        endpoint_hint:
          type: string
          title: Endpoint Hint
          description: owning module API hint for channel deep-links
          default: ''
      type: object
      required:
      - service_code
      - state_id
      - name
      - category
      - mda
      title: ServiceCatalogEntry
      description: 'One MDA service offered through the portal, seeded per state.


        ``module`` names the owning SOS module (e.g. ``mod-mining``); the

        :mod:`app.catalog` providers use it to filter the catalog against the

        state''s enabled-module config. ``endpoint_hint`` is the owning module''s

        API hint used by channel adapters (USSD/IVR) when deep-linking.'
    ServiceCategory:
      type: string
      enum:
      - REVENUE
      - LANDS
      - HEALTH
      - EDUCATION
      - MARKET
      - MINING
      - AGRICULTURE
      - TRANSPORT
      - ENVIRONMENT
      - FORESTRY
      - INVESTMENT
      title: ServiceCategory
    ServiceRequest:
      properties:
        request_id:
          type: string
          title: Request Id
        state_id:
          type: string
          title: State Id
        wallet_id:
          type: string
          title: Wallet Id
        service_code:
          type: string
          title: Service Code
        form_payload:
          additionalProperties:
            type: string
          type: object
          title: Form Payload
        priority:
          $ref: '#/components/schemas/Priority'
          default: STANDARD
        fee_kobo:
          type: integer
          title: Fee Kobo
          default: 0
        status:
          $ref: '#/components/schemas/RequestStatus'
          default: SUBMITTED
        timeline:
          items:
            $ref: '#/components/schemas/StatusEvent'
          type: array
          title: Timeline
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - request_id
      - state_id
      - wallet_id
      - service_code
      title: ServiceRequest
      description: Citizen self-service request with dynamic form payload and timeline.
    ServiceRequestCreate:
      properties:
        state_id:
          type: string
          title: State Id
        wallet_id:
          type: string
          title: Wallet Id
        service_code:
          type: string
          title: Service Code
        form_payload:
          additionalProperties:
            type: string
          type: object
          title: Form Payload
        priority:
          $ref: '#/components/schemas/Priority'
          default: STANDARD
      type: object
      required:
      - state_id
      - wallet_id
      - service_code
      title: ServiceRequestCreate
    SsoSession:
      properties:
        session_id:
          type: string
          title: Session Id
        state_id:
          type: string
          title: State Id
        wallet_id:
          type: string
          title: Wallet Id
        realm:
          type: string
          title: Realm
        client_id:
          type: string
          title: Client Id
        redirect_uri:
          type: string
          title: Redirect Uri
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        status:
          $ref: '#/components/schemas/SsoSessionStatus'
          default: PENDING
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - session_id
      - state_id
      - wallet_id
      - realm
      - client_id
      - redirect_uri
      - expires_at
      title: SsoSession
      description: 'OIDC authorization/session descriptor (Keycloak facade).


        In production the portal redirects to the state realm''s Keycloak

        authorization endpoint; this record is the server-side handle carrying

        redirect URI, scopes, expiry, and realm.'
    SsoSessionCreate:
      properties:
        state_id:
          type: string
          title: State Id
        wallet_id:
          type: string
          title: Wallet Id
        redirect_uri:
          type: string
          title: Redirect Uri
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
      type: object
      required:
      - state_id
      - wallet_id
