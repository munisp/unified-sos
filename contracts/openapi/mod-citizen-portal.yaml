      - AUTHENTICATED
      - EXPIRED
      title: SsoSessionStatus
    StatusEvent:
      properties:
        status:
          type: string
          title: Status
        at:
          type: string
          format: date-time
          title: At
        note:
          type: string
          title: Note
          default: ''
      type: object
      required:
