info:
  title: SOS Unified Citizen Portal, Sovereign Identity SSO & Civil Service Clean-Up API (mod-citizen-portal)
  version: 0.1.0
  description: 'v3.0 / CIT-11 · Lot 7. Citizen identity wallet over Keycloak OIDC multi-realm SSO (raw NIN reduced to a SHA-256
    hash at creation; NIMC API seam), multi-MDA self-service catalog and requests (STANDARD/EXPEDITED priority; 70% state
    / 15% MDA / 15% platform settlement default [DERIVED], state-overridable), e-petitions with public reference IDs, and
    civil-service biometric payroll audit with deterministic ghost-worker detection (₦500m+ recoverable target, Temporal workflow
    seam). Complements, not replaces, mod-identity. Deploys: all 6 states.'
