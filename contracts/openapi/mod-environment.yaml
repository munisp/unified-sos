components:
  schemas:
    AlertSource:
      type: string
      enum:
      - SENTINEL2
      - LANDSAT
      title: AlertSource
    AlertStatus:
      type: string
      enum:
      - RAISED
      - DISPATCHED
      - RESOLVED
      title: AlertStatus
    CarbonCredit:
      properties:
        credit_id:
          type: string
          title: Credit Id
        tenant_state_id:
          type: string
          title: Tenant State Id
        project_id:
          type: string
          title: Project Id
        serial:
          type: string
          title: Serial
          description: unique registry serial, e.g. NG-TAR-2026-0001
        vintage:
          type: integer
          minimum: 2000.0
          title: Vintage
        quantity_tco2e:
          type: number
          exclusiveMinimum: 0.0
          title: Quantity Tco2E
        price_kobo:
          type: integer
          minimum: 0.0
          title: Price Kobo
          default: 0
        status:
          $ref: '#/components/schemas/CreditStatus'
          default: REGISTERED
        owner_id:
          type: string
          title: Owner Id
      type: object
      required:
      - tenant_state_id
      - project_id
      - serial
      - vintage
      - quantity_tco2e
      - owner_id
      title: CarbonCredit
    CarbonProject:
      properties:
        project_id:
          type: string
          title: Project Id
        tenant_state_id:
          type: string
          title: Tenant State Id
        name:
          type: string
          title: Name
        boundary:
          additionalProperties: true
          type: object
          title: Boundary
          description: GeoJSON-like project boundary
        methodology:
          type: string
          title: Methodology
          default: REDD+
        status:
          $ref: '#/components/schemas/CarbonProjectStatus'
          default: REGISTERED
        registered_at:
          type: string
          format: date-time
          title: Registered At
      type: object
      required:
      - tenant_state_id
      - name
      - boundary
      title: CarbonProject
    CarbonProjectStatus:
      type: string
      enum:
      - REGISTERED
      - ISSUED
      - TRANSFERRED
      - RETIRED
      title: CarbonProjectStatus
    ComplianceIncident:
      properties:
        incident_id:
          type: string
          title: Incident Id
        tenant_state_id:
          type: string
          title: Tenant State Id
        facility_id:
          type: string
          title: Facility Id
        reading_id:
          type: string
          title: Reading Id
        medium:
          $ref: '#/components/schemas/Medium'
        parameter:
          $ref: '#/components/schemas/Parameter'
        measured_value:
          type: number
          title: Measured Value
        violation_threshold:
          type: number
          title: Violation Threshold
        base_fine_kobo:
          type: integer
          minimum: 0.0
          title: Base Fine Kobo
        fine_multiplier:
          type: number
          exclusiveMinimum: 0.0
          title: Fine Multiplier
        fine_estimate_kobo:
          type: integer
          minimum: 0.0
          title: Fine Estimate Kobo
        ledger_account_code:
          type: string
          title: Ledger Account Code
          default: '3001'
        status:
          type: string
          title: Status
          default: OPEN
        raised_at:
          type: string
          format: date-time
          title: Raised At
      type: object
      required:
      - tenant_state_id
      - facility_id
      - reading_id
      - medium
      - parameter
      - measured_value
      - violation_threshold
      - base_fine_kobo
      - fine_multiplier
      - fine_estimate_kobo
      title: ComplianceIncident
    ComplianceStatus:
      type: string
      enum:
      - COMPLIANT
      - WARNING
      - VIOLATION
      title: ComplianceStatus
    CreditStatus:
      type: string
      enum:
      - REGISTERED
      - ISSUED
      - TRANSFERRED
      - RETIRED
      title: CreditStatus
    DeforestationAlert:
      properties:
        alert_id:
          type: string
          title: Alert Id
        tenant_state_id:
          type: string
          title: Tenant State Id
        polygon:
          additionalProperties: true
          type: object
          title: Polygon
          description: GeoJSON-like polygon dict
        h3_cells:
          items:
            type: string
          type: array
          title: H3 Cells
        ndvi_delta:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Ndvi Delta
        area_hectares:
          type: number
          exclusiveMinimum: 0.0
          title: Area Hectares
        source:
          $ref: '#/components/schemas/AlertSource'
        status:
          $ref: '#/components/schemas/AlertStatus'
          default: RAISED
        detected_at:
          type: string
          format: date-time
          title: Detected At
        sla_deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Sla Deadline
        enforcement_ticket_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Enforcement Ticket Ref
      type: object
      required:
      - tenant_state_id
      - polygon
      - ndvi_delta
      - area_hectares
      - source
      title: DeforestationAlert
      description: Raised from the lakehouse/Sedona NDVI change-detection job.
    EIAAdvanceRequest:
      properties:
        tenant_state_id:
          type: string
          title: Tenant State Id
        target:
