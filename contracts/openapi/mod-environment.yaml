          - type: 'null'
          title: Facility Id
        category:
          type: string
          title: Category
          description: e.g. CATEGORY_1 | CATEGORY_2 | CATEGORY_3
        documents:
          items:
            type: string
          type: array
          title: Documents
        status:
          $ref: '#/components/schemas/EIAStatus'
          default: SUBMITTED
        decision_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Reason
        temporal_workflow_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Temporal Workflow Ref
        submitted_at:
          type: string
          format: date-time
          title: Submitted At
      type: object
      required:
      - tenant_state_id
      - project_name
      - category
      title: EIAApplication
    EIAStatus:
      type: string
      enum:
      - SUBMITTED
      - SCREENING
      - PUBLIC_COMMENT
      - APPROVED
      - REJECTED
      title: EIAStatus
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Medium:
      type: string
      enum:
      - AIR
      - WATER
      - NOISE
      title: Medium
    Parameter:
      type: string
      enum:
      - PM2_5
      - NO2
      - BOD
      - COD
      - PH
      title: Parameter
    Permit:
      properties:
        permit_id:
          type: string
          title: Permit Id
        tenant_state_id:
          type: string
          title: Tenant State Id
        permit_type:
          $ref: '#/components/schemas/PermitType'
        holder_id:
          type: string
          title: Holder Id
        facility_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Facility Id
        fee_kobo:
          type: integer
          minimum: 0.0
          title: Fee Kobo
        status:
          $ref: '#/components/schemas/PermitStatus'
          default: DRAFT
        issued_at:
          type: string
          format: date-time
          title: Issued At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - tenant_state_id
      - permit_type
      - holder_id
      - fee_kobo
      title: Permit
    PermitStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - SUSPENDED
      - EXPIRED
      title: PermitStatus
    PermitType:
      type: string
      enum:
      - EFFLUENT_DISCHARGE
      - TIMBER_LOGGING
      title: PermitType
    TelemetryEvaluation:
      properties:
        reading:
          $ref: '#/components/schemas/TelemetryReading'
        status:
          $ref: '#/components/schemas/ComplianceStatus'
        incident:
          anyOf:
          - $ref: '#/components/schemas/ComplianceIncident'
          - type: 'null'
      type: object
      required:
      - reading
      - status
      title: TelemetryEvaluation
    TelemetryReading:
      properties:
        reading_id:
          type: string
          title: Reading Id
        tenant_state_id:
          type: string
          title: Tenant State Id
          description: 'tenant: lagos | ogun | osun | benue | nasarawa | taraba'
        facility_id:
          type: string
          title: Facility Id
        sensor_id:
          type: string
          title: Sensor Id
        medium:
          $ref: '#/components/schemas/Medium'
        parameter:
          $ref: '#/components/schemas/Parameter'
        value:
          type: number
          title: Value
        unit:
          type: string
          title: Unit
        measured_at:
          type: string
          format: date-time
          title: Measured At
      type: object
      required:
      - tenant_state_id
      - facility_id
      - sensor_id
      - medium
      - parameter
      - value
      - unit
      title: TelemetryReading
    TransferRequest:
      properties:
        tenant_state_id:
