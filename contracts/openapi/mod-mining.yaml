      tags:
      - mining
      security:
      - bearerAuth: []
  /consignments/{consignment_id}:
    get:
      summary: Get Consignment
      operationId: get_consignment_consignments__consignment_id__get
      parameters:
      - name: consignment_id
        in: path
        required: true
        schema:
          type: string
          title: Consignment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignment-Output'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - mining
      security:
      - bearerAuth: []
  /consignments/{consignment_id}/weighbridge:
    post:
      summary: Weighbridge
      operationId: weighbridge_consignments__consignment_id__weighbridge_post
      parameters:
      - name: consignment_id
        in: path
