      tags:
      - mining
      security:
      - bearerAuth: []
  /consignments:
    post:
      summary: Create Consignment
      operationId: create_consignment_consignments_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consignment-Input'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignment-Output'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - mining
      security:
      - bearerAuth: []
    get:
      summary: List Consignments
      operationId: list_consignments_consignments_get
      parameters:
      - name: state_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consignment-Output'
                title: Response List Consignments Consignments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
