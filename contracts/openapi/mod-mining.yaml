          application/json:
            schema:
              $ref: '#/components/schemas/WeighbridgeReading'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consignment-Output'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - mining
      security:
      - bearerAuth: []
  /consignments/{consignment_id}/assay:
    post:
      summary: Assay
      operationId: assay_consignments__consignment_id__assay_post
      parameters:
      - name: consignment_id
        in: path
