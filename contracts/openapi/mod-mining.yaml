openapi: 3.1.0
info:
  title: SOS Solid Minerals Custody & Levies API (mod-mining)
  version: 0.1.0
  description: 'WP-07 / EPIC-07 · Lot 5 · RT-03. Digital mineral e-permit registry, weight-based levy calculation, IoT weighbridge
    telemetry, RFID truck manifests, quarry checkpoint scanners, artisanal miner registry. Hard constraint: state-competent
    levies only — federal royalty lines separated by construction. Deploys: Nasarawa, Osun, Taraba, Ogun.'
paths:
