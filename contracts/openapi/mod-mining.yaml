        schema:
          type: string
          title: Consignment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssayRecord'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
