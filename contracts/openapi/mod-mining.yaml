    post:
      summary: Register Site
      operationId: register_site_sites_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MineralSite'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MineralSite'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - mining
      security:
      - bearerAuth: []
  /sites/{site_id}:
    get:
      summary: Get Site
      operationId: get_site_sites__site_id__get
      parameters:
      - name: site_id
        in: path
        required: true
        schema:
          type: string
          title: Site Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MineralSite'
        '422':
          description: Validation Error
          content:
            application/json:
