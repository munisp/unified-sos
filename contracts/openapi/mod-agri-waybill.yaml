          title: Vehicle Plate
        origin:
          type: string
          title: Origin
        destination:
          type: string
          title: Destination
        levy_kobo:
          type: integer
          minimum: 0.0
          title: Levy Kobo
          description: per-consignment produce levy
        transfer_code:
