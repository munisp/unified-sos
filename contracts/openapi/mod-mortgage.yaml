components:
  schemas:
    ApplicationIn:
      properties:
        applicant_id:
          type: string
          title: Applicant Id
        parcel_id:
          type: string
          title: Parcel Id
        title_ref:
          type: string
          title: Title Ref
          examples:
          - LAG-2024-000123
        principal_kobo:
          type: integer
          exclusiveMinimum: 0.0
          title: Principal Kobo
        rate_bps:
          type: integer
          minimum: 0.0
          title: Rate Bps
          description: annual interest in basis points
        term_months:
          type: integer
          maximum: 360.0
          minimum: 6.0
          title: Term Months
      type: object
      required:
      - applicant_id
      - parcel_id
      - title_ref
      - principal_kobo
      - rate_bps
      - term_months
      title: ApplicationIn
    ApproveIn:
      properties:
        officer:
          type: string
          title: Officer
        reason:
          type: string
          title: Reason
      type: object
      required:
      - officer
      - reason
      title: ApproveIn
    ForecloseIn:
      properties:
        reason:
          type: string
          title: Reason
      type: object
      required:
      - reason
      title: ForecloseIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LienIn:
      properties:
        second_charge:
          type: boolean
          title: Second Charge
          default: false
        senior_lien_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Senior Lien Id
      type: object
      title: LienIn
    PaymentIn:
      properties:
        amount_kobo:
          type: integer
          exclusiveMinimum: 0.0
          title: Amount Kobo
        idempotency_key:
          type: string
          title: Idempotency Key
      type: object
      required:
      - amount_kobo
      - idempotency_key
      title: PaymentIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
