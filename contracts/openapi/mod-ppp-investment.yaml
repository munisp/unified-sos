      description: 'Procurement-integrity append-only, hash-chained audit record

        (ICRC-compliant documentation from day one).'
    CommercialScore:
      properties:
        lowest_fee_bps:
          type: integer
          exclusiveMinimum: 0.0
          title: Lowest Fee Bps
        bid_fee_bps:
          type: integer
          exclusiveMinimum: 0.0
          title: Bid Fee Bps
        capex_commitment:
          type: integer
          maximum: 80.0
          minimum: 0.0
          title: Capex Commitment
        stepdown_schedule:
          type: integer
          maximum: 40.0
          minimum: 0.0
          title: Stepdown Schedule
        performance_bond:
          type: integer
          maximum: 30.0
          minimum: 0.0
          title: Performance Bond
        fee_weight:
          type: integer
          maximum: 300.0
          minimum: 1.0
          title: Fee Weight
          default: 150
      type: object
      required:
      - lowest_fee_bps
      - bid_fee_bps
      - capex_commitment
      - stepdown_schedule
      - performance_bond
      title: CommercialScore
      description: 'Commercial envelope, max 300.


        S_comm = (lowest acceptable concession fee % / bid fee %) × fee weight.

        Per the scorecard breakdown the fee component carries 150 of 300; the

        remaining 150 split as CapEx 80 / step-down 40 / performance bond 30.'
