components:
  schemas:
    ChildParcelSpec:
      properties:
        parcel_uin:
          type: string
          title: Parcel Uin
          description: Unique Identification Number for the child parcel
        boundary_geojson:
          additionalProperties: true
          type: object
          title: Boundary Geojson
          description: GeoJSON Polygon, WGS84 (EPSG:4326)
        owner_stin:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Stin
          description: 'DEPRECATED: ownership changes via subdivision/merger are forbidden — children inherit the parent owner.
            Supplying a value different from the parent''s owner is rejected with 422.'
        survey_plan_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Survey Plan No
      type: object
      required:
      - parcel_uin
      - boundary_geojson
      title: ChildParcelSpec
      description: Boundary + identity of one child parcel produced by subdivision/merger.
    CompensationCategory:
      type: string
      enum:
      - LAND
      - IMPROVEMENTS
      - CROPS
      - DISTURBANCE
      title: CompensationCategory
    CompensationItemIn:
      properties:
        category:
          $ref: '#/components/schemas/CompensationCategory'
        amount_kobo:
          type: integer
          minimum: 0.0
          title: Amount Kobo
      type: object
      required:
      - category
      - amount_kobo
      title: CompensationItemIn
    ConsentIn:
      properties:
        parcel_id:
          type: string
          format: uuid
          title: Parcel Id
        expires_at:
          type: string
          format: date-time
          title: Expires At
        actor:
          type: string
          title: Actor
          default: governor
      type: object
      required:
      - parcel_id
      - expires_at
      title: ConsentIn
      description: Governor consent instrument issuance body.
    CourtOrderApplyIn:
      properties:
        actor:
          type: string
          title: Actor
          default: registrar:filings
      type: object
      title: CourtOrderApplyIn
    CourtOrderApproveIn:
      properties:
        actor:
          type: string
          title: Actor
        role:
          type: string
          title: Role
      type: object
      required:
      - actor
      - role
      title: CourtOrderApproveIn
    CourtOrderIn:
      properties:
        parcel_id:
          type: string
          format: uuid
          title: Parcel Id
        order_type:
          $ref: '#/components/schemas/CourtOrderType'
        order_number:
          type: string
          title: Order Number
        court:
          type: string
          title: Court
        instrument_hash:
          type: string
          title: Instrument Hash
        effective_date:
          type: string
          title: Effective Date
        new_owner_stin:
          anyOf:
          - type: string
          - type: 'null'
          title: New Owner Stin
        new_boundary_geojson:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: New Boundary Geojson
        actor:
          type: string
          title: Actor
          default: registrar:filings
      type: object
      required:
      - parcel_id
      - order_type
      - order_number
      - court
      - instrument_hash
      - effective_date
      title: CourtOrderIn
      description: Court-order filing body.
    CourtOrderType:
      type: string
      enum:
      - VEST_TITLE
      - RECTIFY_OWNER
      - RECTIFY_BOUNDARY
      title: CourtOrderType
    DeedVerificationRequest:
      properties:
        c_of_o_number:
          type: string
          title: C Of O Number
        parcel_uin:
          anyOf:
          - type: string
          - type: 'null'
          title: Parcel Uin
      type: object
      required:
      - c_of_o_number
      title: DeedVerificationRequest
      description: 'Contract schema: verifyDeed request body.'
    DeedVerificationResult:
      properties:
        valid:
          type: boolean
          title: Valid
        c_of_o_number:
          type: string
          title: C Of O Number
        parcel_uin:
          anyOf:
          - type: string
          - type: 'null'
          title: Parcel Uin
        tenant_state_id:
          type: string
          title: Tenant State Id
        title_type:
          anyOf:
          - $ref: '#/components/schemas/TitleType'
          - type: 'null'
        parcel_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Parcel Status
          description: Lifecycle status of the parcel (invalid results include it)
        reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference
          description: Replacement C-of-O number or revocation reference for superseded/replaced/revoked titles
        signature_chain:
          items:
            type: string
          type: array
          title: Signature Chain
          description: 'Ordered JWS (Ed25519/EdDSA) tokens: registry issuance signature, governor consent countersignature'
        detail:
          type: string
          title: Detail
          default: ''
      type: object
      required:
      - valid
      - c_of_o_number
      - tenant_state_id
      title: DeedVerificationResult
      description: 'Deed verification result with signature chain (contract: verifyDeed 200).'
    DisputeDecisionIn:
      properties:
        actor:
          type: string
          title: Actor
        resolution_note:
          type: string
          title: Resolution Note
          default: ''
      type: object
      required:
      - actor
      title: DisputeDecisionIn
      description: Dispute review/resolve/dismiss body.
    DisputeGrounds:
      type: string
      enum:
      - BOUNDARY
      - OWNERSHIP
      - FRAUD
      - INHERITANCE
      - OTHER
      title: DisputeGrounds
      description: Legal grounds for lodging a cadastral dispute.
    DisputeIn:
      properties:
        complainant:
          type: string
          title: Complainant
        grounds:
          $ref: '#/components/schemas/DisputeGrounds'
        description:
          type: string
          title: Description
          default: ''
      type: object
      required:
      - complainant
      - grounds
      title: DisputeIn
      description: Dispute lodgement body.
    EncumbranceCloseIn:
      properties:
        actor:
          type: string
          title: Actor
        reason:
          type: string
          title: Reason
          default: ''
      type: object
      required:
      - actor
      title: EncumbranceCloseIn
      description: Encumbrance release/withdrawal body.
    EncumbranceIn:
      properties:
        type:
          $ref: '#/components/schemas/EncumbranceType'
        instrument_hash:
          type: string
          title: Instrument Hash
        priority:
          type: integer
          title: Priority
          default: 0
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        actor:
          type: string
          title: Actor
          default: lands-registry
      type: object
      required:
      - type
      - instrument_hash
      title: EncumbranceIn
      description: Encumbrance registration body.
