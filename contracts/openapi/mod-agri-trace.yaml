        lot_id:
          type: string
          title: Lot Id
        tenant_state_id:
          type: string
          title: Tenant State Id
        farmer_id:
          type: string
          title: Farmer Id
        commodity:
          type: string
          title: Commodity
        weight_kg:
          type: number
          exclusiveMinimum: 0.0
          title: Weight Kg
        grade:
          $ref: '#/components/schemas/QualityGrade'
        moisture_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Moisture Pct
        latitude:
          type: number
          title: Latitude
        longitude:
          type: number
          title: Longitude
        created_at:
          type: string
          title: Created At
        stored:
          type: boolean
          title: Stored
          default: false
      type: object
      required:
      - lot_id
      - tenant_state_id
      - farmer_id
      - commodity
      - weight_kg
      - grade
      - moisture_pct
      - latitude
      - longitude
      - created_at
      title: Lot
    LotIntake:
      properties:
        farmer_id:
          type: string
          title: Farmer Id
        commodity:
          type: string
          title: Commodity
        weight_kg:
          type: number
          exclusiveMinimum: 0.0
          title: Weight Kg
        grade:
