          type: string
          title: Kyc Ref
          description: KYC reference from mod-kyc-kyb
        lga:
          type: string
          title: Lga
          default: ''
        phone:
          type: string
          title: Phone
          default: ''
      type: object
      required:
      - name
      - kyc_ref
      title: FarmerRegistration
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Lot:
