asyncapi: 2.6.0
info:
  title: SOS Platform Lifecycle & Settlement Events
  version: 1.0.0
  description: Control-plane tenant lifecycle events and financial settlement events.
channels:
  ng.sos.tenant.provisioned:
    publish:
      operationId: tenantProvisioned
      description: Emitted by the control plane when a state tenant completes provisioning (WP-01)
      message:
        payload:
          type: object
          required: [tenant_id, state, tier, timestamp]
          properties:
            tenant_id: { type: string }
            state: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            tier: { type: string, enum: [dedicated, hybrid, shared] }
            keycloak_realm: { type: string }
            postgres_schema: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.payments.settlement_completed:
    publish:
      operationId: settlementCompleted
      description: >-
        Emitted after Mojaloop clearing and TigerBeetle atomic statutory split
        (WP-04 flow step 5: real-time webhook confirms MDA). Clause 22.2:
        vendor share distributed strictly via ledger execution.
      message:
        payload:
          type: object
          required: [state_id, bill_reference, gross_amount_kobo, splits, tigerbeetle_transfer_ids, timestamp]
          properties:
            state_id: { type: string }
            bill_reference: { type: string }
            gross_amount_kobo: { type: integer }
            splits:
              type: array
              items:
                type: object
                properties:
                  beneficiary: { type: string, description: e.g. STATE_CONSOLIDATED_REVENUE_FUND, MDA_RETENTION, PPP_CONCESSIONAIRE_ESCROW }
                  tigerbeetle_account_code: { type: integer }
                  amount_kobo: { type: integer }
            tigerbeetle_transfer_ids:
              type: array
              items: { type: string, description: 128-bit ID as decimal string }
            timestamp: { type: string, format: date-time }
  ng.sos.gis.unassessed_property_discovered:
    publish:
      operationId: unassessedPropertyDiscovered
      description: Sedona satellite footprint ↔ cadastre join findings (WP-06/WP-14)
      message:
        payload:
          type: object
          properties:
            state_id: { type: string }
            building_footprint_id: { type: string }
            parcel_uin: { type: string, nullable: true }
            audit_status:
              type: string
              enum: [UNREGISTERED_ENCROACHMENT, UNASSESSED_IMPROVEMENT, COMPLIANT]
            estimated_area_sqm: { type: number }
            timestamp: { type: string, format: date-time }
  ng.sos.environment.deforestation_alert_raised:
    publish:
      operationId: deforestationAlertRaised
      description: >-
        Emitted by mod-environment (ENV-09) when the lakehouse NDVI job raises a
        deforestation alert. Carries H3 cells and the 4-hour response SLA deadline;
        dispatch publishes an SEC-10 enforcement ticket reference.
      message:
        payload:
          type: object
          required: [state_id, alert_id, h3_cells, area_hectares, source, sla_deadline, timestamp]
          properties:
            state_id: { type: string }
            alert_id: { type: string }
            h3_cells:
              type: array
              items: { type: string }
            ndvi_delta: { type: number }
            area_hectares: { type: number }
            source: { type: string, enum: [SENTINEL2, LANDSAT] }
            sla_deadline: { type: string, format: date-time }
            enforcement_ticket_ref: { type: string, nullable: true }
            timestamp: { type: string, format: date-time }
  ng.sos.environment.compliance_violation_raised:
    publish:
      operationId: complianceViolationRaised
      description: >-
        Emitted by mod-environment (ENV-09) when an industrial telemetry reading
        breaches the per-state compliance limit and a violation incident is created.
      message:
        payload:
          type: object
          required: [state_id, incident_id, facility_id, medium, parameter, fine_estimate_kobo, timestamp]
          properties:
            state_id: { type: string }
            incident_id: { type: string }
            reading_id: { type: string }
            facility_id: { type: string }
            medium: { type: string, enum: [AIR, WATER, NOISE] }
            parameter: { type: string }
            value: { type: number }
            fine_estimate_kobo: { type: integer }
            timestamp: { type: string, format: date-time }
  ng.sos.citizen.payroll_audit_completed:
    publish:
      operationId: payrollAuditCompleted
      description: >-
        Emitted by mod-citizen-portal (CIT-11) when a civil-service biometric
        payroll audit completes, summarising ghost-worker findings and
        recoverable savings in kobo.
      message:
        payload:
          type: object
          required: [state_id, audit_id, period, staff_scanned, findings_count, recoverable_kobo, timestamp]
          properties:
            state_id: { type: string }
            audit_id: { type: string }
            period: { type: string }
            staff_scanned: { type: integer }
            findings_count: { type: integer }
            recoverable_kobo: { type: integer }
            workflow_ref: { type: string, nullable: true, description: Temporal durable cleanup workflow reference }
            timestamp: { type: string, format: date-time }
  ng.sos.kyc.case_decision_made:
    publish:
      operationId: kycCaseDecisionMade
      description: >-
        Emitted by mod-kyc-kyb when a KYC case reaches a terminal decision
        (APPROVED / REJECTED / SUSPENDED / EXPIRED). NDPA data-minimization:
        payload carries decision metadata and hashes only — never raw NIN,
        document bytes, biometrics, or OCR text.
      message:
        payload:
          type: object
          required: [state_id, case_id, decision, risk_band, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            subject_type: { type: string, description: e.g. CITIZEN | AGENT | CIVIL_SERVANT | VENDOR }
            subject_ref_hash: { type: string, description: SHA-256 of the subject reference }
            decision: { type: string, enum: [APPROVED, REJECTED, SUSPENDED, EXPIRED] }
            risk_score: { type: integer }
            risk_band: { type: string, enum: [LOW, MEDIUM, HIGH, PROHIBITED] }
            decided_by: { type: string, description: SYSTEM or reviewer identifier }
            audit_entry_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.kyb.case_decision_made:
    publish:
      operationId: kybCaseDecisionMade
      description: >-
        Emitted by mod-kyc-kyb when a KYB case reaches a terminal decision.
        Carries registry verification outcome and risk band; no raw registry
        payloads or CAC document content.
      message:
        payload:
          type: object
          required: [state_id, case_id, decision, risk_band, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            rc_number_hash: { type: string, description: SHA-256 of the RC number }
            legal_name: { type: string }
            decision: { type: string, enum: [APPROVED, REJECTED, SUSPENDED, EXPIRED] }
            risk_score: { type: integer }
            risk_band: { type: string, enum: [LOW, MEDIUM, HIGH, PROHIBITED] }
            registry_status: { type: string, enum: [MATCH, MISMATCH, NOT_FOUND, UNAVAILABLE] }
            decided_by: { type: string }
            audit_entry_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.kyc.liveness_failed:
    publish:
      operationId: kycLivenessFailed
      description: >-
        Emitted by mod-kyc-kyb when liveness evidence fails scoring or an
        anti-spoof check triggers (nonce mismatch, expiry, excessive attempts,
        artifact hash reuse). Scores/hashes only — no biometric media.
      message:
        payload:
          type: object
          required: [state_id, case_id, challenge_id, reasons, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            challenge_id: { type: string }
            score: { type: number, minimum: 0, maximum: 1 }
            anti_spoof_flags:
              type: array
              items: { type: string }
            reasons:
              type: array
              items: { type: string }
            evidence_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.kyb.registry_verification_completed:
    publish:
      operationId: kybRegistryVerificationCompleted
      description: >-
        Emitted by mod-kyc-kyb after a registry adapter check (CAC, NIMC, TAX,
        SANCTIONS) completes for a KYB case. The registry response is hashed;
        raw registry payloads are never published.
      message:
        payload:
          type: object
          required: [state_id, case_id, registry, status, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            registry: { type: string, enum: [CAC, NIMC, TAX, SANCTIONS] }
            status: { type: string, enum: [MATCH, MISMATCH, NOT_FOUND, UNAVAILABLE] }
            fields_checked:
              type: array
              items: { type: string }
            confidence: { type: number, minimum: 0, maximum: 1 }
            response_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.geospatial.dataset_registered:
    publish:
      operationId: geospatialDatasetRegistered
      description: >-
        Emitted by mod-geospatial when a geospatial dataset is registered in
        PostGIS (system of record). Minimized payload: identifiers and metadata
        references only — no raw geometry or PII.
      message:
        payload:
          type: object
          required: [state_id, dataset_id, dataset_type, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            dataset_id: { type: string }
            dataset_type: { type: string, enum: [PARCEL, RASTER, VECTOR, H3_INDEX, GEOPARQUET] }
            source_uri: { type: string }
            crs: { type: string }
            h3_resolution: { type: integer, nullable: true }
            timestamp: { type: string, format: date-time }
  ng.sos.geospatial.processing_job_completed:
    publish:
      operationId: geospatialProcessingJobCompleted
      description: >-
        Emitted by mod-geospatial when a geospatial processing job reaches a
        terminal state. Results are referenced by URI + hash with metrics only.
      message:
        payload:
          type: object
          required: [state_id, job_id, job_type, status, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            job_id: { type: string }
            job_type: { type: string, enum: [H3_INDEX, SPATIAL_JOIN, NDVI, GEOLIBRE_PROJECT, AGENCY_SYNC] }
            status: { type: string, enum: [COMPLETED, FAILED] }
            output_uri: { type: string, nullable: true }
            result_hash: { type: string, nullable: true }
            metrics: { type: object, additionalProperties: true }
            timestamp: { type: string, format: date-time }
  ng.sos.geospatial.geolibre_project_built:
    publish:
      operationId: geolibreProjectBuilt
      description: >-
        Emitted by mod-geospatial after authoring a .geolibre.json project for
        the self-hosted GeoLibre workbench. Project referenced by URI + hash;
        GeoLibre is never the system of record.
      message:
        payload:
          type: object
          required: [state_id, project_id, name, project_uri, project_hash, redaction_level, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            project_id: { type: string }
            name: { type: string }
            project_uri: { type: string }
            project_hash: { type: string }
            redaction_level: { type: string, enum: [FULL, PARTIAL, NONE] }
            source_job_id: { type: string, nullable: true }
            timestamp: { type: string, format: date-time }
  ng.sos.geospatial.agency_sync_completed:
    publish:
      operationId: geospatialAgencySyncCompleted
      description: >-
        Emitted by mod-geospatial when an inter-agency geodata sync link run
        completes. Only link status and content hash are published.
      message:
        payload:
          type: object
          required: [state_id, link_id, agency, direction, status, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            link_id: { type: string }
            agency: { type: string }
            direction: { type: string, enum: [PUSH, PULL] }
            status: { type: string, enum: [COMPLETED, FAILED] }
            records_synced: { type: integer, nullable: true }
            content_hash: { type: string, nullable: true }
            timestamp: { type: string, format: date-time }
  ng.sos.erp.journal_pushed:
    publish:
      operationId: erpJournalPushed
      description: >-
        Emitted by mod-erp-bridge after a balanced journal entry is pushed to
        the state ERP backend (Odoo / ERPNext / IFMIS export) and recorded in
        the hash-chained outbound log. Carries only references and hashes —
        no journal line detail beyond COA codes and kobo totals.
      message:
        payload:
          type: object
          required: [state_id, entry_id, source_event_id, entry_hash, backend, receipt_id, event_hash, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            entry_id: { type: string }
            source_event_id: { type: string, description: Dedupe key of the originating platform event }
            entry_hash: { type: string, description: SHA-256 of the canonical journal payload }
            backend: { type: string, enum: [fixture, odoo, erpnext, ifmis_export] }
            receipt_id: { type: string }
            event_hash: { type: string, description: Hash-chain link of the outbound log record }
            timestamp: { type: string, format: date-time }
  ng.sos.agri.warehouse_receipt_issued:
    publish:
      operationId: agriWarehouseReceiptIssued
      description: >-
        Emitted by mod-agri-trace when a hash-chained warehouse receipt is
        issued for a stored commodity lot (National Edition mod-agri-trace).
      message:
        payload:
          type: object
          required: [state_id, receipt_id, lot_id, warehouse_id, commodity, quantity_kg, entry_hash, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            receipt_id: { type: string }
            lot_id: { type: string }
            warehouse_id: { type: string }
            commodity: { type: string }
            quantity_kg: { type: integer }
            entry_hash: { type: string, description: Hash-chain link of the receipt record }
            timestamp: { type: string, format: date-time }
  ng.sos.agri.receipt_pledged:
    publish:
      operationId: agriReceiptPledged
      description: Emitted by mod-agri-trace when a warehouse receipt is pledged as collateral.
      message:
        payload:
          type: object
          required: [state_id, receipt_id, holder_ref, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            receipt_id: { type: string }
            holder_ref: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.agri.receipt_redeemed:
    publish:
      operationId: agriReceiptRedeemed
      description: Emitted by mod-agri-trace when a warehouse receipt is released/redeemed (settlement intent).
      message:
        payload:
          type: object
          required: [state_id, receipt_id, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            receipt_id: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.agri.lot_traced_hop:
    publish:
      operationId: agriLotTracedHop
      description: Emitted by mod-agri-trace for each provenance hop (farm/aggregation/warehouse/processor/export).
      message:
        payload:
          type: object
          required: [state_id, lot_id, hop, actor_ref, entry_hash, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            lot_id: { type: string }
            hop: { type: string, enum: [farm, aggregation, warehouse, processor, export] }
            actor_ref: { type: string }
            entry_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.border.transit_crossing_recorded:
    publish:
      operationId: borderTransitCrossingRecorded
      description: Emitted by mod-border-transit when a consignment records an RFID crossing event.
      message:
        payload:
          type: object
          required: [state_id, consignment_id, crossing_id, direction, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            consignment_id: { type: string }
            crossing_id: { type: string }
            direction: { type: string, enum: [EXPORT, IMPORT] }
            timestamp: { type: string, format: date-time }
  ng.sos.border.tamper_alert:
    publish:
      operationId: borderTamperAlert
      description: Emitted by mod-border-transit on seal breach or corridor route deviation.
      message:
        payload:
          type: object
          required: [state_id, consignment_id, alert_type, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            consignment_id: { type: string }
            alert_type: { type: string, enum: [seal_broken, route_deviation, geofence_deviation] }
            timestamp: { type: string, format: date-time }
  ng.sos.border.levy_assessed:
    publish:
      operationId: borderLevyAssessed
      description: Emitted by mod-border-transit when a transit levy (flat + ad-valorem bps, integer kobo) is assessed.
      message:
        payload:
          type: object
          required: [state_id, consignment_id, levy_kobo, entry_hash, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            consignment_id: { type: string }
            levy_kobo: { type: integer }
            entry_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.waterways.ticket_sold:
    publish:
      operationId: waterwaysTicketSold
      description: Emitted by mod-waterways on ferry e-ticket sale (capacity-enforced, integer kobo fare).
      message:
        payload:
          type: object
          required: [state_id, trip_id, ticket_ref, fare_kobo, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            trip_id: { type: string }
            ticket_ref: { type: string }
            fare_kobo: { type: integer }
            timestamp: { type: string, format: date-time }
  ng.sos.waterways.dredging_volume_alert:
    publish:
      operationId: waterwaysDredgingVolumeAlert
      description: Emitted by mod-waterways when a dredger exceeds its licensed monthly volume quota.
      message:
        payload:
          type: object
          required: [state_id, dredger_id, volume_m3, quota_m3, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            dredger_id: { type: string }
            volume_m3: { type: number }
            quota_m3: { type: number }
            timestamp: { type: string, format: date-time }
  ng.sos.waterways.royalty_assessed:
    publish:
      operationId: waterwaysRoyaltyAssessed
      description: Emitted by mod-waterways when a dredging royalty (kobo per m3) is assessed, hash-chain audited.
      message:
        payload:
          type: object
          required: [state_id, dredger_id, royalty_kobo, entry_hash, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba, abia, adamawa, akwa_ibom, anambra, bauchi, bayelsa, borno, cross_river, delta, ebonyi, edo, ekiti, enugu, gombe, imo, jigawa, kaduna, kano, katsina, kebbi, kogi, kwara, niger, ondo, oyo, plateau, rivers, sokoto, yobe, zamfara, fct] }
            dredger_id: { type: string }
            royalty_kobo: { type: integer }
            entry_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.safecity.face_match:
    publish:
      operationId: safecityFaceMatch
      description: >-
        Emitted by mod-safecity-vision when an enrolled watchlist subject is
        matched on a camera frame. Only emitted under a valid NDPA 2023
        authorization (warrant/DPO record); carries match confidence and the
        audit hash-chain link — never raw embeddings or imagery.
      message:
        payload:
          type: object
          required: [state_id, camera_id, subject_ref, similarity, authorization_ref, audit_hash, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            camera_id: { type: string }
            subject_ref: { type: string, description: Watchlist subject reference (pseudonymised) }
            similarity: { type: number, description: Cosine similarity of the match }
            authorization_ref: { type: string, description: NDPA warrant/DPO authorization record id }
            audit_hash: { type: string, description: Hash-chain link of the face-lookup audit record }
            timestamp: { type: string, format: date-time }
  ng.sos.safecity.crowd_alert:
    publish:
      operationId: safecityCrowdAlert
      description: >-
        Emitted by mod-safecity-vision when a camera's crowd density or flow
        crosses its configured threshold (stampede risk). Consumed by
        mod-police-cad for dispatch and by the transparency feed.
      message:
        payload:
          type: object
          required: [state_id, camera_id, alert_type, density, threshold, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            camera_id: { type: string }
            alert_type: { type: string, enum: [density, flow, stampede_risk] }
            density: { type: number, description: Persons per square metre }
            threshold: { type: number }
            timestamp: { type: string, format: date-time }
  ng.sos.safecity.anomaly_detected:
    publish:
      operationId: safecityAnomalyDetected
      description: >-
        Emitted by mod-safecity-vision on rule/ML anomaly detection:
        loitering, perimeter breach (geofence polygon), object-left-behind,
        running/stampede.
      message:
        payload:
          type: object
          required: [state_id, camera_id, anomaly_type, severity, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            camera_id: { type: string }
            anomaly_type: { type: string, enum: [loitering, perimeter_breach, object_left_behind, running, stampede] }
            severity: { type: string, enum: [low, medium, high, critical] }
            details: { type: string, nullable: true }
            timestamp: { type: string, format: date-time }
