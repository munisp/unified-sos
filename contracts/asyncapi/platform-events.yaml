asyncapi: 2.6.0
info:
  title: SOS Platform Lifecycle & Settlement Events
  version: 1.0.0
  description: Control-plane tenant lifecycle events and financial settlement events.
channels:
  ng.sos.tenant.provisioned:
    publish:
      operationId: tenantProvisioned
      description: Emitted by the control plane when a state tenant completes provisioning (WP-01)
      message:
        payload:
          type: object
          required: [tenant_id, state, tier, timestamp]
          properties:
            tenant_id: { type: string }
            state: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            tier: { type: string, enum: [dedicated, hybrid, shared] }
            keycloak_realm: { type: string }
            postgres_schema: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.payments.settlement_completed:
    publish:
      operationId: settlementCompleted
      description: >-
        Emitted after Mojaloop clearing and TigerBeetle atomic statutory split
        (WP-04 flow step 5: real-time webhook confirms MDA). Clause 22.2:
        vendor share distributed strictly via ledger execution.
      message:
        payload:
          type: object
          required: [state_id, bill_reference, gross_amount_kobo, splits, tigerbeetle_transfer_ids, timestamp]
          properties:
            state_id: { type: string }
            bill_reference: { type: string }
            gross_amount_kobo: { type: integer }
            splits:
              type: array
              items:
                type: object
                properties:
                  beneficiary: { type: string, description: e.g. STATE_CONSOLIDATED_REVENUE_FUND, MDA_RETENTION, PPP_CONCESSIONAIRE_ESCROW }
                  tigerbeetle_account_code: { type: integer }
                  amount_kobo: { type: integer }
            tigerbeetle_transfer_ids:
              type: array
              items: { type: string, description: 128-bit ID as decimal string }
            timestamp: { type: string, format: date-time }
  ng.sos.gis.unassessed_property_discovered:
    publish:
      operationId: unassessedPropertyDiscovered
      description: Sedona satellite footprint ↔ cadastre join findings (WP-06/WP-14)
      message:
        payload:
          type: object
          properties:
            state_id: { type: string }
            building_footprint_id: { type: string }
            parcel_uin: { type: string, nullable: true }
            audit_status:
              type: string
              enum: [UNREGISTERED_ENCROACHMENT, UNASSESSED_IMPROVEMENT, COMPLIANT]
            estimated_area_sqm: { type: number }
            timestamp: { type: string, format: date-time }
  ng.sos.environment.deforestation_alert_raised:
    publish:
      operationId: deforestationAlertRaised
      description: >-
        Emitted by mod-environment (ENV-09) when the lakehouse NDVI job raises a
        deforestation alert. Carries H3 cells and the 4-hour response SLA deadline;
        dispatch publishes an SEC-10 enforcement ticket reference.
      message:
        payload:
          type: object
          required: [state_id, alert_id, h3_cells, area_hectares, source, sla_deadline, timestamp]
          properties:
            state_id: { type: string }
            alert_id: { type: string }
            h3_cells:
              type: array
              items: { type: string }
            ndvi_delta: { type: number }
            area_hectares: { type: number }
            source: { type: string, enum: [SENTINEL2, LANDSAT] }
            sla_deadline: { type: string, format: date-time }
            enforcement_ticket_ref: { type: string, nullable: true }
            timestamp: { type: string, format: date-time }
  ng.sos.environment.compliance_violation_raised:
    publish:
      operationId: complianceViolationRaised
      description: >-
        Emitted by mod-environment (ENV-09) when an industrial telemetry reading
        breaches the per-state compliance limit and a violation incident is created.
      message:
        payload:
          type: object
          required: [state_id, incident_id, facility_id, medium, parameter, fine_estimate_kobo, timestamp]
          properties:
            state_id: { type: string }
            incident_id: { type: string }
            reading_id: { type: string }
            facility_id: { type: string }
            medium: { type: string, enum: [AIR, WATER, NOISE] }
            parameter: { type: string }
            value: { type: number }
            fine_estimate_kobo: { type: integer }
            timestamp: { type: string, format: date-time }
  ng.sos.citizen.payroll_audit_completed:
    publish:
      operationId: payrollAuditCompleted
      description: >-
        Emitted by mod-citizen-portal (CIT-11) when a civil-service biometric
        payroll audit completes, summarising ghost-worker findings and
        recoverable savings in kobo.
      message:
        payload:
          type: object
          required: [state_id, audit_id, period, staff_scanned, findings_count, recoverable_kobo, timestamp]
          properties:
            state_id: { type: string }
            audit_id: { type: string }
            period: { type: string }
            staff_scanned: { type: integer }
            findings_count: { type: integer }
            recoverable_kobo: { type: integer }
            workflow_ref: { type: string, nullable: true, description: Temporal durable cleanup workflow reference }
            timestamp: { type: string, format: date-time }
  ng.sos.kyc.case_decision_made:
    publish:
      operationId: kycCaseDecisionMade
      description: >-
        Emitted by mod-kyc-kyb when a KYC case reaches a terminal decision
        (APPROVED / REJECTED / SUSPENDED / EXPIRED). NDPA data-minimization:
        payload carries decision metadata and hashes only — never raw NIN,
        document bytes, biometrics, or OCR text.
      message:
        payload:
          type: object
          required: [state_id, case_id, decision, risk_band, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            subject_type: { type: string, description: e.g. CITIZEN | AGENT | CIVIL_SERVANT | VENDOR }
            subject_ref_hash: { type: string, description: SHA-256 of the subject reference }
            decision: { type: string, enum: [APPROVED, REJECTED, SUSPENDED, EXPIRED] }
            risk_score: { type: integer }
            risk_band: { type: string, enum: [LOW, MEDIUM, HIGH, PROHIBITED] }
            decided_by: { type: string, description: SYSTEM or reviewer identifier }
            audit_entry_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.kyb.case_decision_made:
    publish:
      operationId: kybCaseDecisionMade
      description: >-
        Emitted by mod-kyc-kyb when a KYB case reaches a terminal decision.
        Carries registry verification outcome and risk band; no raw registry
        payloads or CAC document content.
      message:
        payload:
          type: object
          required: [state_id, case_id, decision, risk_band, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            rc_number_hash: { type: string, description: SHA-256 of the RC number }
            legal_name: { type: string }
            decision: { type: string, enum: [APPROVED, REJECTED, SUSPENDED, EXPIRED] }
            risk_score: { type: integer }
            risk_band: { type: string, enum: [LOW, MEDIUM, HIGH, PROHIBITED] }
            registry_status: { type: string, enum: [MATCH, MISMATCH, NOT_FOUND, UNAVAILABLE] }
            decided_by: { type: string }
            audit_entry_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.kyc.liveness_failed:
    publish:
      operationId: kycLivenessFailed
      description: >-
        Emitted by mod-kyc-kyb when liveness evidence fails scoring or an
        anti-spoof check triggers (nonce mismatch, expiry, excessive attempts,
        artifact hash reuse). Scores/hashes only — no biometric media.
      message:
        payload:
          type: object
          required: [state_id, case_id, challenge_id, reasons, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            challenge_id: { type: string }
            score: { type: number, minimum: 0, maximum: 1 }
            anti_spoof_flags:
              type: array
              items: { type: string }
            reasons:
              type: array
              items: { type: string }
            evidence_hash: { type: string }
            timestamp: { type: string, format: date-time }
  ng.sos.kyb.registry_verification_completed:
    publish:
      operationId: kybRegistryVerificationCompleted
      description: >-
        Emitted by mod-kyc-kyb after a registry adapter check (CAC, NIMC, TAX,
        SANCTIONS) completes for a KYB case. The registry response is hashed;
        raw registry payloads are never published.
      message:
        payload:
          type: object
          required: [state_id, case_id, registry, status, timestamp]
          properties:
            state_id: { type: string, enum: [lagos, ogun, osun, benue, nasarawa, taraba] }
            case_id: { type: string }
            registry: { type: string, enum: [CAC, NIMC, TAX, SANCTIONS] }
            status: { type: string, enum: [MATCH, MISMATCH, NOT_FOUND, UNAVAILABLE] }
            fields_checked:
              type: array
              items: { type: string }
            confidence: { type: number, minimum: 0, maximum: 1 }
            response_hash: { type: string }
            timestamp: { type: string, format: date-time }
