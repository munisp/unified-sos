# deploy/tuning/postgresql.conf
# SOS platform PostgreSQL 16 + PostGIS 3.4 (postgis/postgis:16-3.4) tuning.
# Target: OLTP + spatial mixed workload behind per-state-tenant deployments.
# Apply via helm (postgres subchart config parameters) or mount as a ConfigMap
# into /etc/postgresql/postgresql.conf for the shared/dedicated clusters.
# Size against the node: values below assume a 32 vCPU / 128 GiB dedicated
# Tier-1 node; scale proportionally for shared Tier-3 clusters.

# --- Memory ---------------------------------------------------------------
shared_buffers = 32GB                  # 25% of RAM; PG16 gains little past ~40%
effective_cache_size = 96GB            # ~75% of RAM (OS page cache included)
work_mem = 64MB                        # per sort/hash node; spatial joins multiply
maintenance_work_mem = 2GB             # VACUUM/CREATE INDEX on cadastre tables
huge_pages = try                       # reduces TLB misses on big shared_buffers

# --- Connections -----------------------------------------------------------
# Never let apps connect directly at scale: put PgBouncer (transaction
# pooling) in front and cap server-side connections. RLS uses
# SET LOCAL per transaction, so transaction pooling is safe; session
# pooling breaks RLS context and is forbidden.
max_connections = 400                  # pgbouncer server-side pool ceiling
superuser_reserved_connections = 10
# PgBouncer: pool_mode=transaction, default_pool_size=50 per tenant DB,
# max_client_conn=10000, server_reset_query=DISCARD ALL.

# --- WAL / durability ------------------------------------------------------
wal_level = replica
max_wal_size = 16GB                    # fewer checkpoints during bulk cadastre loads
min_wal_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9     # spread checkpoint I/O
wal_compression = on                   # full-page images compress well on GIS rows
synchronous_commit = off               # async for POS/waybill ingest paths;
                                       # keep 'on' only for payment-adjacent tables
                                       # (TigerBeetle is the system of record anyway)

# --- Planner / OLTP --------------------------------------------------------
random_page_cost = 1.1                 # NVMe sos-nvme StorageClass
effective_io_concurrency = 200
jit = off                              # JIT hurts short OLTP queries (compile time)
max_parallel_workers_per_gather = 2
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# --- Autovacuum (hot tables: assessments, payments, waybills) ---------------
autovacuum_max_workers = 6
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05  # hot tables churn; default 0.2 is too lazy
autovacuum_analyze_scale_factor = 0.02

# --- Logging / observability ------------------------------------------------
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
auto_explain.log_min_duration = '1s'
auto_explain.log_analyze = off
auto_explain.log_buffers = on
track_io_timing = on

# --- Per-tenant RLS performance notes ---------------------------------------
# Row-Level Security on (tenant_state_id) is the shared-tier isolation
# boundary (docs/architecture/06-tenancy-security.md). At OLTP scale:
# 1. Partition hot tables (revenue assessments, payments, waybills,
#    land use charge ledgers) BY LIST (tenant_state_id), hash-subpartition
#    by month for time-series pruning. RLS then adds a qual that partition
#    pruning already satisfies, so per-tenant queries touch 1 partition.
# 2. Mark the current_setting('sos.tenant') accessor STABLE and wrap the
#    policy expression in a subselect: tenant_state_id = (SELECT
#    current_setting('sos.tenant')) so the planner treats it as a constant.
# 3. Keep per-tenant composite indexes with tenant_state_id FIRST on
#    unpartitioned lookup tables.
# 4. Use FORCE ROW LEVEL SECURITY so table owners are also constrained.

# --- PostGIS specifics -------------------------------------------------------
# postgis/postgis:16-3.4 image (deploy/docker-compose.yml).
# - spatial_ref_sys + GiST indexes live in shared_buffers; keep geometry
#   columns TOASTed (main storage) and ANALYZE after bulk cadastre loads.
# - Use geography only where geodetic math is required; geometry(4326) with
#   GiST is cheaper for point-in-polygon verification (mod-gis-lands).
# - Set work_mem >= 256MB per-session for Sedona/Martin bulk tile jobs via
#   SET LOCAL in their connection role, not globally.
# - parallel GiST index builds: max_parallel_maintenance_workers above.
