# deploy/tuning/kafka-server.properties
# Apache Kafka (or Kafka-compatible Redpanda, as used in deploy/docker-compose.yml)
# broker tuning for the SOS event backbone. Topics follow ng.sos.<domain>.<event>
# naming (e.g. ng.sos.revenue.assessments — the KEDA autoscaling topic in
# infra/helm/sos-platform/values.yaml).

# --- Partitions & replication (per-topic defaults; set explicitly on create) ---
num.partitions=48                       # hot revenue/payment topics; 12 for cold domains
default.replication.factor=3
min.insync.replicas=2                   # acks=all producers: tolerate 1 broker loss
unclean.leader.election.enable=false    # never trade durability for availability

# --- ISR / durability ----------------------------------------------------------
replica.lag.time.max.ms=30000
min.insync.replicas.isr.check.interval.ms=5000
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

# --- Producer-side throughput (documented here; set on producers) ---------------
# batch.size=262144  linger.ms=10  compression.type=zstd  acks=all
# max.in.flight.requests.per.connection=5  enable.idempotence=true
# Broker-side receive buffers sized for batched zstd payloads:
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600

# --- Log retention ---------------------------------------------------------------
# Hot topics (assessments, payments): 7 days, size-capped per partition.
log.retention.hours=168
log.retention.bytes=107374182400        # 100 GiB per partition ceiling
log.segment.bytes=1073741824
log.roll.hours=24
log.retention.check.interval.ms=300000
# Audit/security topics override to 7-year WORM archive — those land in
# OpenSearch (deploy/tuning/opensearch.yml); Kafka is transit, not archive.

# --- Threads / I/O (16 vCPU broker on NVMe) ---------------------------------------
num.io.threads=16
num.network.threads=8
num.replica.fetchers=4
log.flush.interval.messages=9223372036854775807   # rely on OS page cache + replication
log.flush.interval.ms=9223372036854775807

# --- Quotas (noisy-tenant control across state tenants) -----------------------------
quota.consumer.default=52428800         # 50 MB/s per client-id
quota.producer.default=52428800
