# deploy/tuning/redis.conf
# Redis 7 tuning for the two SOS roles. Pick ONE role block per instance;
# do not run one Redis as both cache and queue at production scale.
# Dev compose runs `redis-server --appendonly yes` (queue-style); production
# splits cache vs queue per role below.

# --- Shared baseline ---------------------------------------------------------
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300
maxclients 10000
io-threads 4                  # offload reads/writes; TLS termination benefits most
io-threads-do-reads yes
lazyfree-lazy-expire yes
lazyfree-lazy-eviction yes
replica-lazy-flush yes

# ============================================================================
# ROLE A — cache (sessions, rate-limit counters, policy-pack lookup cache)
# ============================================================================
# Persistence OFF: this is a cache; losing it is a warm-up event, not data loss.
save ""
appendonly no
maxmemory 8gb
maxmemory-policy allkeys-lru      # evict cold keys; never block writers
maxmemory-samples 10
# eviction of expired keys under memory pressure:
active-expire-effort 5

# ============================================================================
# ROLE B — queue / coordination (Dapr state, job queues, idempotency keys)
# ============================================================================
# Uncomment for the queue role. AOF with everysec: ≤1s data loss window,
# fsync cost amortized; no-sync only for replicas behind a durable stream.
# save ""
# appendonly yes
# appendfsync everysec
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 1gb
# aof-use-rdb-preamble yes
# no-appendfsync-on-rewrite yes
# maxmemory 8gb
# maxmemory-policy noeviction     # queues must NEVER silently evict; alert at 80%
