# Cilium helm values for the SOS platform (official chart: cilium/cilium).
# Install:
#   helm install cilium cilium/cilium --version 1.16.5 \
#     --namespace kube-system -f deploy/cilium/install/values.yaml
#
# Two deployment profiles are documented inline:
#   * SHARED tier    (Tier 3, many states per cluster) — defaults below.
#   * DEDICATED tier (Tier 1/2, one state per cluster, often bare metal in a
#     state data centre) — flip the flagged blocks.

# ---------------------------------------------------------------------------
# Datapath
# ---------------------------------------------------------------------------
# Replace kube-proxy/iptables with eBPF service load balancing. This is the
# single largest latency win for the millions-TPS revenue path and removes
# iptables-reload stalls during KEDA scale-out bursts.
kubeProxyReplacement: "true"
# API server endpoints for the kube-proxy-free datapath. Set explicitly —
# auto-detection breaks during control-plane hibernation/restore cycles on
# state DC clusters.
# k8sServiceHost: "sos-k8s-api.<state>.sos.gov.ng"
# k8sServicePort: 6443

# Socket-level LB for pod->ClusterIP traffic inside the node (extra latency
# win for chatty pairs like mod-rev-core <-> tigerbeetle).
socketLB:
  enabled: true

# Per-pod bandwidth fairness: a KEDA-driven consumer burst from one state
# tenant must not starve co-tenants on shared-tier hardware.
bandwidthManager:
  enabled: true
  bbr: false   # BBR optional; enable only after benchmarking on state DC NICs

# Routing mode.
# SHARED tier (public cloud / overlay-friendly): tunnel keeps node L3
# requirements minimal.
routingMode: "tunnel"
tunnelProtocol: "vxlan"
# DEDICATED tier on bare metal in state data centres with routable pod CIDRs:
#   routingMode: "native"
#   autoDirectNodeRoutes: true
#   ipv4NativeRoutingCIDR: "10.42.0.0/16"
# Native routing removes VXLAN encap/decap overhead — prefer it wherever the
# state DC fabric can route pod CIDRs (BGP via cilium-bgp-control-plane, or
# static routes). Use tunnel mode only when L3 reachability cannot be
# guaranteed between nodes.

# ---------------------------------------------------------------------------
# IPAM
# ---------------------------------------------------------------------------
ipam:
  mode: "cluster-pool"   # per-node pod CIDRs; works for both profiles
  operator:
    clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
    clusterPoolIPv4MaskSize: 24

# ---------------------------------------------------------------------------
# Policy / fail-closed posture
# ---------------------------------------------------------------------------
# Deny-by-default CNI behaviour: pods with no selecting policy are isolated.
# Combined with policies/default-deny.yaml this makes policy loss fail-closed.
policyEnforcementMode: "default"
policyAuditMode: false   # set true temporarily during rollout dry-run only
enablePolicySecrets: true  # TLS cert fetch for L7 TLS termination policies

# ---------------------------------------------------------------------------
# Hubble observability
# ---------------------------------------------------------------------------
hubble:
  enabled: true
  relay:
    enabled: true
    replicas: 2   # survives node hibernation/maintenance
    prometheus:
      enabled: true
      port: 9966
  ui:
    enabled: true
  metrics:
    enabled:
      # Flow-level metrics scraped into the existing SOS Prometheus
      # (deploy/observability/). Labels include verdict + drop reason for
      # the policy-verdicts dashboards.
      - "dns:query;ignoreAAAA"
      - "drop:sourceContext=workload-name;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace"
      - "tcp"
      - "flow:sourceContext=workload-name;destinationContext=workload-name;labelsContext=source_namespace,destination_namespace"
      - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
    serviceMonitor:
      enabled: true   # matches the in-cluster Prometheus Operator/self-hosted scrape config
  tls:
    auto:
      method: helm

# ---------------------------------------------------------------------------
# Tetragon runtime security (policies in deploy/cilium/tetragon/)
# ---------------------------------------------------------------------------
tetragon:
  enabled: true
  export:
    mode: "stdout"   # collected by the node log pipeline into OpenSearch
    filename: ""     # set to /var/run/cilium/tetragon/tetragon.log on dedicated tier
  prometheus:
    enabled: true
  enablePolicyCred: true
  enableProcessAncestors: true   # full process lineage for NDPA audit trails

# ---------------------------------------------------------------------------
# Operator / hibernation-safe defaults
# ---------------------------------------------------------------------------
operator:
  replicas: 2
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# State DCs hibernate non-production node pools overnight to save power.
# These defaults keep the agent from churning through long restart storms:
rollOutCiliumPods: true
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
# Keep agents pinned on hibernating nodes instead of evicting them.
agentNotReadyTaintKey: "node.cilium.io/agent-not-ready"
# Generous startup so a cold-booting node passes readiness before traffic.
readinessProbe:
  failureThreshold: 10
  periodSeconds: 10
startupProbe:
  failureThreshold: 105
  periodSeconds: 5

# eBPF map sizing for 37-tenant scale on shared clusters; dedicated tier can
# halve these.
bpf:
  masquerade: true          # required for egress FQDN SNAT on shared tier
  ctMapMax: 524288
  natMapMax: 524288

# L7 proxy (Envoy) for HTTP/FQDN policy — required by policies/l7-api.yaml
# and policies/egress-allowlist.yaml.
envoy:
  enabled: true
  prometheus:
    serviceMonitor:
      enabled: true

# Prometheus scrape of the agents themselves (merged with hubble metrics in
# deploy/cilium/observability/).
prometheus:
  enabled: true
  port: 9962
  serviceMonitor:
    enabled: true

# Do NOT let Cilium manage CNI config of host-network pods that predate it.
cni:
  exclusive: false
