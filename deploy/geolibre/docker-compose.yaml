# GeoLibre self-hosted GIS workbench — standalone sovereign deployment.
#
# GeoLibre is a workbench ONLY: PostGIS remains the system of record
# (db/migrations/0006_geospatial.sql). Sharing and hosted collaboration are
# disabled by default: no public share/collab endpoints, no hosted data
# destination, WASM sidecar off. See deploy/docker-compose.yml for the
# equivalent in-line service entry.
name: sos-geolibre

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geolibre}
      POSTGRES_USER: ${POSTGRES_USER:-geolibre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  geolibre:
    image: ghcr.io/opengeos/geolibre:2.0
    environment:
      # Sovereignty posture: no hosted share/collab, no WASM sidecar.
      GEOLIBRE_SHARE_URL: "off"
      # GEOLIBRE_COLLAB_URL intentionally unset — no hosted collaboration
      GEOLIBRE_DISABLE_SIDECAR: "1"
      GEOLIBRE_DATABASE_URL: postgresql://${POSTGRES_USER:-geolibre}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geolibre}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
