# SOS platform Prometheus scrape configuration (Stage 7.C).
# One job per module service; services are discovered via Kubernetes
# endpoints and matched on the app.kubernetes.io/component label rendered
# by infra/helm/sos-platform. Keep this file in sync with the modules map in
# infra/helm/sos-platform/values.yaml — infra/tests/validate_infra.py enforces it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- alerts.yml
scrape_configs:
- job_name: control-plane
  kubernetes_sd_configs:
  - role: endpoints
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_label_app_kubernetes_io_component
    regex: control-plane
    action: keep
  - source_labels:
    - __meta_kubernetes_pod_container_port_number
    regex: '8000'
    action: keep
  - target_label: service
    replacement: control-plane
- job_name: mod-agri-waybill
