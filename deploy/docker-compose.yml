# SOS local development stack (Tier-3-equivalent, single node).
# NOT production: production runs on Kubernetes via infra/helm/sos-platform
# (one release per state tenant). See deploy/README.md for the tier mapping.
name: sos-local

services:
  postgres:
    image: postgis/postgis:16-3.4
    # Latency tuning (dev-tier, sized to the 2G limit below; production
    # parameters are set per-tenant in infra/helm/sos-platform):
    # - shared_buffers 512MB (~25% of limit), work_mem 16MB per sort/hash,
    # - jit off for short OLTP-style queries, 200 max connections.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=200
      - -c
      - jit=off
      - -c
      - random_page_cost=1.1
      # Uncomment for slow-query triage during perf runs:
      # - -c
      # - log_min_duration_statement=250
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sos-dev-only-not-a-secret}
      POSTGRES_DB: ${POSTGRES_DB:-sos}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Migrations applied once on first boot, in lexicographic order.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sos} -d $${POSTGRES_DB:-sos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    # NOTE: redis backs durable seams (queues/outbox-style state), so AOF
    # persistence stays ON — do NOT switch to appendonly no or an LRU
    # eviction policy here. maxmemory is a guardrail only; noeviction makes
    # OOM loud rather than silently dropping durable keys.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.40
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    command:
      - start
      - --cache-grid=512MiB
      - --addresses=0.0.0.0:3000
      - /data/0_0.tigerbeetle
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle-data:/data

  tigerbeetle-init:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.40
    command:
      - format
      - --cluster=0
      - --replica=0
      - --replica-count=1
      - /data/0_0.tigerbeetle
    volumes:
      - tigerbeetle-data:/data
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only-not-a-secret}
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      # Realm import hook — drop per-state realm JSON here (mirrors the
      # keycloak-realm-import-job in infra/helm/sos-platform).
      - ./keycloak:/opt/keycloak/data/import:ro

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          memory: 512M
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Advertised listeners: in-compose clients (EVENT_KAFKA_BOOTSTRAP)
      # must use redpanda:29092 (PLAINTEXT); host tooling uses localhost:9092
      # (OUTSIDE). Do not point containers at redpanda:9092 — the broker
      # would advertise localhost:9092 back to them.
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sos-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sos-dev-only-not-a-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true" # dev only; production enforces TLS+SSO
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-SosDevOnly_NotASecret1!}
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # --- Flagship application services -------------------------------------

  mod-rev-core:
    build:
      context: ..
      dockerfile: services/mod-rev-core/Dockerfile
    image: ghcr.io/munisp/mod-rev-core:dev
    environment:
      REV_CORE_ADDR: ":8080"
      # In-memory ledger by default. REV_CORE_LEDGER=tigerbeetle is verified
      # against services/mod-rev-core/cmd/server/main.go, but the TigerBeetle
      # adapter is behind `//go:build tigerbeetle` (ledger/splits/tigerbeetle.go)
      # and the Dockerfile builds WITHOUT `-tags tigerbeetle`, so the stub
      # (tigerbeetle_stub.go) is a hard startup error. Keep memory until the
      # image is rebuilt with the tag:
      # REV_CORE_LEDGER: tigerbeetle
      REV_CORE_LEDGER: memory
      TB_ADDRESSES: tigerbeetle:3000
    ports:
      # Host port remapped 8080 -> 8037: caddy (8080:80) owns host :8080.
      # NOTE for deploy/observability/prometheus.yml (owned by another
      # workstream — do not edit here): the `mod-rev-core` scrape job must
      # target host port 8037 (container :8080 unchanged).
      - "8037:8080"
    depends_on:
      tigerbeetle:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]

  mod-gis-lands:
    build:
      context: ../services/mod-gis-lands
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-gis-lands:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sos}:${POSTGRES_PASSWORD:-sos-dev-only-not-a-secret}@postgres:5432/${POSTGRES_DB:-sos}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
      # Bus seam is optional in lands_app/eventlog.py (fail-soft publish);
      # the env is honored once the service wires event_bus_from_env.
      EVENT_BUS: ${EVENT_BUS:-kafka}
      EVENT_KAFKA_BOOTSTRAP: ${EVENT_KAFKA_BOOTSTRAP:-redpanda:29092}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- v3.0 application services (ENV-09, CIT-11) -------------------------

  mod-environment:
    build:
      context: ../services/mod-environment
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-environment:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  mod-citizen-portal:
    build:
      context: ../services/mod-citizen-portal
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-citizen-portal:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # SSO facade targets the local Keycloak dev realm (one realm per state
      # tenant in production; see deploy/keycloak/).
      KEYCLOAK_BASE_URL: http://keycloak:8080
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
    ports:
      - "8011:8000"
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  mod-kyc-kyb:
    build:
      context: ../services/mod-kyc-kyb
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-kyc-kyb:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local mode = deterministic simulated adapters; production mode
      # requires real PaddleOCR/Docling/VLM/registry adapter config
      # (see services/mod-kyc-kyb/README.md).
      KYC_KYB_MODE: local
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
      # Bus seam is optional in app/service.py (fail-soft publish); the env
      # is honored once the service wires event_bus_from_env.
      EVENT_BUS: ${EVENT_BUS:-kafka}
      # NOTE: redpanda advertises PLAINTEXT://redpanda:29092 in-compose and
      # OUTSIDE://localhost:9092 for the host — containers must use 29092.
      EVENT_KAFKA_BOOTSTRAP: ${EVENT_KAFKA_BOOTSTRAP:-redpanda:29092}
    ports:
      # Container serves :8090 (see services/mod-kyc-kyb/Dockerfile).
      - "8012:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Stage 5 geospatial platform (GEO/LND) ------------------------------

  mod-geospatial:
    build:
      # Dockerfile expects the REPO ROOT context (it COPYs geospatial/local/).
      context: ..
      dockerfile: services/mod-geospatial/Dockerfile
    image: ghcr.io/munisp/mod-geospatial:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local mode = deterministic pure-Python adapters; production mode
      # requires PostGIS + Sedona/lakehouse endpoints (fail closed otherwise).
      GEOSPATIAL_MODE: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-sos}:${POSTGRES_PASSWORD:-sos-dev-only-not-a-secret}@postgres:5432/${POSTGRES_DB:-sos}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
      # Bus seam is optional in app/service.py (fail-soft publish); the env
      # is honored once the service wires event_bus_from_env.
      EVENT_BUS: ${EVENT_BUS:-kafka}
      EVENT_KAFKA_BOOTSTRAP: ${EVENT_KAFKA_BOOTSTRAP:-redpanda:29092}
    ports:
      # Container serves :8013 (see services/mod-geospatial/Dockerfile).
      - "8013:8013"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8013/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- P2 Workstream E: public read-only transparency views ---------------

  mod-transparency:
    build:
      context: ../services/mod-transparency
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-transparency:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local default = deterministic in-memory fixture; production mode sets
      # POLICE_CAD_BASE_URL + PPP_INVESTMENT_BASE_URL (fail closed otherwise).
      POLICE_CAD_BASE_URL: ${POLICE_CAD_BASE_URL:-}
      PPP_INVESTMENT_BASE_URL: ${PPP_INVESTMENT_BASE_URL:-}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
    ports:
      - "8015:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- ERP integration bridge (Odoo / ERPNext / IFMIS export) ------------

  mod-erp-bridge:
    build:
      context: ../services/mod-erp-bridge
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-erp-bridge:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local default = deterministic fixture adapter; production sets
      # ERP_BACKEND=odoo|erpnext|ifmis_export + the backend env vars
      # (fail closed otherwise — see services/mod-erp-bridge/README.md).
      ERP_BACKEND: ${ERP_BACKEND:-local}
      # LEFT ON MEMORY (audit finding 3): with EVENT_BUS=kafka,
      # app/service.py build_service() constructs KafkaEventBus and
      # ErpBridgeService.__init__ calls bus.subscribe(), which raises
      # NotImplementedError in _shared/eventbus (Kafka consumption runs in
      # dedicated consumers) — the container would crash at boot.
      EVENT_BUS: ${EVENT_BUS:-memory}
      IFMIS_EXPORT_DIR: ${IFMIS_EXPORT_DIR:-/tmp/ifmis-export}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
    ports:
      - "8016:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5


  # --- Safe-City AI/CV camera analytics (face rec, crowd, anomaly) ---------

  mod-safecity-vision:
    build:
      context: ../services/mod-safecity-vision
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-safecity-vision:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local default = deterministic fixture engine; production sets
      # SOS_VISION_ENGINE=insightface + SOS_VISION_MODEL_DIR +
      # SOS_VISION_AUTHORIZATIONS_FILE (NDPA warrant/DPO records) —
      # fail closed otherwise (see services/mod-safecity-vision/README.md).
      SOS_VISION_ENGINE: ${SOS_VISION_ENGINE:-fixture}
      # app/main.py wires event_bus_from_env with fail-soft fallback to
      # in-memory if the bus cannot be constructed.
      EVENT_BUS: ${EVENT_BUS:-kafka}
      EVENT_KAFKA_BOOTSTRAP: ${EVENT_KAFKA_BOOTSTRAP:-redpanda:29092}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
    ports:
      - "8017:8000"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5


  # --- Agri commodity traceability & warehouse receipts (National Edition) -

  mod-agri-trace:
    build:
      context: ../services/mod-agri-trace
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-agri-trace:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-benue}
      # fixture default; production: SOS_AGRI_PROFILE=production +
      # SOS_AGRI_EXCHANGE_URL / SOS_AGRI_IOT_URL (fail closed otherwise)
      SOS_AGRI_PROFILE: ${SOS_AGRI_PROFILE:-fixture}
      # app/main.py wires event_bus_from_env with fail-soft fallback to
      # in-memory if the bus cannot be constructed.
      EVENT_BUS: ${EVENT_BUS:-kafka}
      EVENT_KAFKA_BOOTSTRAP: ${EVENT_KAFKA_BOOTSTRAP:-redpanda:29092}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
    ports:
      - "8018:8000"
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Cross-border cargo RFID transit (National Edition) ------------------

  mod-border-transit:
    build:
      context: ../services/mod-border-transit
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-border-transit:dev
