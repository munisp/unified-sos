      SOS_LANDDOCS_PROFILE: ${SOS_LANDDOCS_PROFILE:-fixture}
      # landdocs_app/main.py wires event_bus_from_env with fail-soft
      # fallback to in-memory if the bus cannot be constructed.
      EVENT_BUS: ${EVENT_BUS:-kafka}
      EVENT_KAFKA_BOOTSTRAP: ${EVENT_KAFKA_BOOTSTRAP:-redpanda:29092}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
      # MinIO S3 seam — LEFT COMMENTED (audit finding 5): landdocs_app/
      # adapters.py S3ObjectStore reads SOS_LANDDOCS_BUCKET, but put()/get()
      # raise AdapterUnavailableError in this image ("wired on the
      # production image") and no S3 endpoint env is read, so setting the
      # bucket would break document upload/retrieval rather than wire MinIO.
      # SOS_LANDDOCS_BUCKET: s3://land-docs
      # (MinIO endpoint for when the boto3 wiring lands: http://minio:9000,
      #  creds ${MINIO_ROOT_USER}/${MINIO_ROOT_PASSWORD})
