# SOS local development stack (Tier-3-equivalent, single node).
# NOT production: production runs on Kubernetes via infra/helm/sos-platform
# (one release per state tenant). See deploy/README.md for the tier mapping.
name: sos-local

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sos-dev-only-not-a-secret}
      POSTGRES_DB: ${POSTGRES_DB:-sos}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Migrations applied once on first boot, in lexicographic order.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sos} -d $${POSTGRES_DB:-sos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.40
    command:
      - start
      - --cache-grid=512MiB
      - --addresses=0.0.0.0:3000
      - /data/0_0.tigerbeetle
    ports:
      - "3000:3000"
    volumes:
      - tigerbeetle-data:/data

  tigerbeetle-init:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.40
    command:
      - format
      - --cluster=0
      - --replica=0
      - --replica-count=1
      - /data/0_0.tigerbeetle
    volumes:
      - tigerbeetle-data:/data
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-only-not-a-secret}
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      # Realm import hook — drop per-state realm JSON here (mirrors the
      # keycloak-realm-import-job in infra/helm/sos-platform).
      - ./keycloak:/opt/keycloak/data/import:ro

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sos-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sos-dev-only-not-a-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true" # dev only; production enforces TLS+SSO
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-SosDevOnly_NotASecret1!}
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # --- Flagship application services -------------------------------------

  mod-rev-core:
    build:
      context: ..
      dockerfile: services/mod-rev-core/Dockerfile
    image: ghcr.io/munisp/mod-rev-core:dev
    environment:
      REV_CORE_ADDR: ":8080"
      # In-memory ledger by default; switch to tigerbeetle once the Go
      # TB adapter is provisioned (see ledger/README.md).
      REV_CORE_LEDGER: memory
      TB_ADDRESSES: tigerbeetle:3000
    ports:
      - "8080:8080"
    depends_on:
      tigerbeetle:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]

  mod-gis-lands:
    build:
      context: ../services/mod-gis-lands
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-gis-lands:dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sos}:${POSTGRES_PASSWORD:-sos-dev-only-not-a-secret}@postgres:5432/${POSTGRES_DB:-sos}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- v3.0 application services (ENV-09, CIT-11) -------------------------

  mod-environment:
    build:
      context: ../services/mod-environment
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-environment:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  mod-citizen-portal:
    build:
      context: ../services/mod-citizen-portal
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-citizen-portal:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # SSO facade targets the local Keycloak dev realm (one realm per state
      # tenant in production; see deploy/keycloak/).
      KEYCLOAK_BASE_URL: http://keycloak:8080
    ports:
      - "8011:8000"
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  mod-kyc-kyb:
    build:
      context: ../services/mod-kyc-kyb
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-kyc-kyb:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local mode = deterministic simulated adapters; production mode
      # requires real PaddleOCR/Docling/VLM/registry adapter config
      # (see services/mod-kyc-kyb/README.md).
      KYC_KYB_MODE: local
    ports:
      - "8012:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Stage 5 geospatial platform (GEO/LND) ------------------------------

  mod-geospatial:
    build:
      context: ../services/mod-geospatial
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-geospatial:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local mode = deterministic pure-Python adapters; production mode
      # requires PostGIS + Sedona/lakehouse endpoints (fail closed otherwise).
      GEOSPATIAL_MODE: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-sos}:${POSTGRES_PASSWORD:-sos-dev-only-not-a-secret}@postgres:5432/${POSTGRES_DB:-sos}
    ports:
      - "8013:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- P2 Workstream E: public read-only transparency views ---------------

  mod-transparency:
    build:
      context: ../services/mod-transparency
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-transparency:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local default = deterministic in-memory fixture; production mode sets
      # POLICE_CAD_BASE_URL + PPP_INVESTMENT_BASE_URL (fail closed otherwise).
      POLICE_CAD_BASE_URL: ${POLICE_CAD_BASE_URL:-}
      PPP_INVESTMENT_BASE_URL: ${PPP_INVESTMENT_BASE_URL:-}
    ports:
      - "8015:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- ERP integration bridge (Odoo / ERPNext / IFMIS export) ------------

  mod-erp-bridge:
    build:
      context: ../services/mod-erp-bridge
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-erp-bridge:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local default = deterministic fixture adapter; production sets
      # ERP_BACKEND=odoo|erpnext|ifmis_export + the backend env vars
      # (fail closed otherwise — see services/mod-erp-bridge/README.md).
      ERP_BACKEND: ${ERP_BACKEND:-local}
      EVENT_BUS: ${EVENT_BUS:-memory}
      IFMIS_EXPORT_DIR: ${IFMIS_EXPORT_DIR:-/tmp/ifmis-export}
    ports:
      - "8016:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5


  # --- Safe-City AI/CV camera analytics (face rec, crowd, anomaly) ---------

  mod-safecity-vision:
    build:
      context: ../services/mod-safecity-vision
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-safecity-vision:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # local default = deterministic fixture engine; production sets
      # SOS_VISION_ENGINE=insightface + SOS_VISION_MODEL_DIR +
      # SOS_VISION_AUTHORIZATIONS_FILE (NDPA warrant/DPO records) —
      # fail closed otherwise (see services/mod-safecity-vision/README.md).
      SOS_VISION_ENGINE: ${SOS_VISION_ENGINE:-fixture}
      EVENT_BUS: ${EVENT_BUS:-memory}
    ports:
      - "8017:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5


  # --- Agri commodity traceability & warehouse receipts (National Edition) -

  mod-agri-trace:
    build:
      context: ../services/mod-agri-trace
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-agri-trace:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-benue}
      # fixture default; production: SOS_AGRI_PROFILE=production +
      # SOS_AGRI_EXCHANGE_URL / SOS_AGRI_IOT_URL (fail closed otherwise)
      SOS_AGRI_PROFILE: ${SOS_AGRI_PROFILE:-fixture}
      EVENT_BUS: ${EVENT_BUS:-memory}
    ports:
      - "8018:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Cross-border cargo RFID transit (National Edition) ------------------

  mod-border-transit:
    build:
      context: ../services/mod-border-transit
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-border-transit:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-taraba}
      SOS_BORDER_PROFILE: ${SOS_BORDER_PROFILE:-fixture}
      EVENT_BUS: ${EVENT_BUS:-memory}
    ports:
      - "8019:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Inland waterways e-ticketing & dredging volumetrics (National) ------

  mod-waterways:
    build:
      context: ../services/mod-waterways
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-waterways:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-lagos}
      SOS_WATERWAYS_PROFILE: ${SOS_WATERWAYS_PROFILE:-fixture}
      EVENT_BUS: ${EVENT_BUS:-memory}
    ports:
      - "8020:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5


  # --- Caddy edge: automatic HTTPS + per-state whitelabel domains ----------

  caddy:
    build:
      context: ../deploy/caddy
      dockerfile: Dockerfile
    image: ghcr.io/munisp/sos-caddy-edge:dev
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # --- ML inference (CPU) + MLflow tracking --------------------------------

  mod-ml-inference:
    build:
      context: ..
      dockerfile: services/mod-ml-inference/Dockerfile
    image: ghcr.io/munisp/mod-ml-inference:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # fixture default = deterministic heuristic tagged model_version=fixture;
      # production: SOS_ML_PROFILE=production + SOS_ML_ARTIFACTS_DIR +
      # SOS_MLFLOW_TRACKING_URI (fail closed otherwise)
      SOS_ML_PROFILE: ${SOS_ML_PROFILE:-fixture}
      EVENT_BUS: ${EVENT_BUS:-memory}
    volumes:
      - ../ml/artifacts:/app/ml/artifacts:ro
    ports:
      - "8021:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlruns

  mod-geospatial-gateway:
    build:
      context: ../services/mod-geospatial-gateway
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-geospatial-gateway:dev
    environment:
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      GEOSPATIAL_UPSTREAM_URL: http://mod-geospatial:8000
    ports:
      - "8014:8014"
    depends_on:
      mod-geospatial:
        condition: service_started

  # Self-hosted GeoLibre GIS workbench (sovereign deployment).
  # GeoLibre is a workbench ONLY — PostGIS remains the system of record.
  # Sharing and hosted collaboration are disabled by default: no public
  # share/collab endpoints, no hosted data destination, WASM sidecar off.
  geolibre:
    image: ghcr.io/opengeos/geolibre:2.0
    environment:
      GEOLIBRE_SHARE_URL: "off"
      # GEOLIBRE_COLLAB_URL intentionally unset — no hosted collaboration
      GEOLIBRE_DISABLE_SIDECAR: "1"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  tigerbeetle-data:
  minio-data:
  caddy-data:
  caddy-config:
  mlflow-data:
  opensearch-data:
