  # --- APISIX API gateway (Layer 1 edge target for Caddy) -------------------
  # Standalone/quickstart note: deploy/tuning/apisix.yaml is the shared 3.9
  # tuning config (etcd-driven in production). For a fully standalone local
  # gateway (config_provider: yaml, no etcd), point APISIX_IMAGE at an image
  # baked with the standalone deployment block + apisix-routes.generated.yaml
  # (deploy/tuning/generate_apisix_routes.py); the mounted tuning config is
  # applied in both modes.
  apisix:
    image: ${APISIX_IMAGE:-apache/apisix:3.9.0}
    volumes:
      - ../deploy/tuning/apisix.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080"

  # --- Citizen PWA (Layer 1 web target for Caddy) ---------------------------
  # Build context apps/citizen-pwa (Vite build); the multi-stage Dockerfile
  # ships with the PWA workstream — until it lands, override with
  # CITIZEN_PWA_IMAGE pointing at a prebuilt image.
  citizen-pwa:
