        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Mortgage & lien management (state land registries) -----------------

  mod-mortgage:
    build:
      context: ../services/mod-mortgage
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-mortgage:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # fixture credit/ledger defaults; production: SOS_MORTGAGE_PROFILE=production
      # + SOS_MORTGAGE_TB_URL + SOS_MORTGAGE_LANDS_URL (fail closed otherwise)
      SOS_MORTGAGE_PROFILE: ${SOS_MORTGAGE_PROFILE:-fixture}
      SOS_MORTGAGE_CREDIT_URL: ${SOS_MORTGAGE_CREDIT_URL:-http://mod-ml-inference:8000/ml/v1/credit/score}
      EVENT_BUS: ${EVENT_BUS:-memory}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
      # TigerBeetle seam — LEFT COMMENTED (audit finding 4): mortgage_app/
      # adapters.py TigerBeetleLedgerAdapter (SOS_MORTGAGE_LEDGER=tigerbeetle
      # + SOS_MORTGAGE_TB_URL, scheme tb://host:port per tests) requires the
      # optional `tigerbeetle` Python package, which is not in this image's
      # requirements — setting these would raise AdapterUnavailableError at
      # boot (fail-closed).
      # SOS_MORTGAGE_LEDGER: tigerbeetle
      # SOS_MORTGAGE_TB_URL: tb://tigerbeetle:3000
    ports:
      - "8023:8000"
    depends_on:
      tigerbeetle:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  mod-ml-inference:
    build:
      context: ..
      dockerfile: services/mod-ml-inference/Dockerfile
    image: ghcr.io/munisp/mod-ml-inference:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      # fixture default = deterministic heuristic tagged model_version=fixture;
      # production: SOS_ML_PROFILE=production + SOS_ML_ARTIFACTS_DIR +
      # SOS_MLFLOW_TRACKING_URI (fail closed otherwise)
      SOS_ML_PROFILE: ${SOS_ML_PROFILE:-fixture}
      # app/main.py currently instantiates InMemoryEventBus directly; the
      # env is honored once the service wires event_bus_from_env.
      EVENT_BUS: ${EVENT_BUS:-kafka}
      EVENT_KAFKA_BOOTSTRAP: ${EVENT_KAFKA_BOOTSTRAP:-redpanda:29092}
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
      # Verified env name in app/registry.py; in fixture profile the URI is
      # stored for the production flip (the optional mlflow client package
      # is only required when SOS_ML_PROFILE=production).
      SOS_MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../ml/artifacts:/app/ml/artifacts:ro
    ports:
      - "8021:8000"
    depends_on:
      redpanda:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlruns

  mod-geospatial-gateway:
    build:
      context: ../services/mod-geospatial-gateway
      dockerfile: Dockerfile
    image: ghcr.io/munisp/mod-geospatial-gateway:dev
    # Resource guardrails for the single-node dev tier; production
    # requests/limits are rendered by infra/helm/sos-platform.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    environment:
      # Perf tuning: uvicorn honors UVICORN_* env (CLI flags in the
      # Dockerfile stay the source of truth; uvloop ships in uvicorn[standard]).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOOP: ${UVICORN_LOOP:-uvloop}
      TENANT_STATE_ID: ${TENANT_STATE_ID:-osun}
      GEOSPATIAL_UPSTREAM_URL: http://mod-geospatial:8013
      SOS_AUTH_PROFILE: ${SOS_AUTH_PROFILE:-development}
    ports:
      - "8014:8014"
    depends_on:
      mod-geospatial:
        condition: service_started

  # Self-hosted GeoLibre GIS workbench (sovereign deployment).
  # GeoLibre is a workbench ONLY — PostGIS remains the system of record.
  # Sharing and hosted collaboration are disabled by default: no public
  # share/collab endpoints, no hosted data destination, WASM sidecar off.
  geolibre:
    image: ghcr.io/opengeos/geolibre:2.0
    environment:
      GEOLIBRE_SHARE_URL: "off"
      # GEOLIBRE_COLLAB_URL intentionally unset — no hosted collaboration
      GEOLIBRE_DISABLE_SIDECAR: "1"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  tigerbeetle-data:
  minio-data:
  caddy-data:
  caddy-config:
  mlflow-data:
  opensearch-data:
