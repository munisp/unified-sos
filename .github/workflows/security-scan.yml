name: security-scan

# Security & license gates (WP-17 / Lot 8; acceptance-framework Stage 3 feeds).
# All third-party actions are pinned to full-length commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly, Africa/Lagos ops window

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  trivy-fs:
    name: Filesystem vulnerability scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run trivy fs scan (SARIF)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore

  license-check:
    name: License whitelist check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Enforce permissive license whitelist
        run: |
          python3 - <<'PY'
          """License whitelist gate (docs/procurement/acceptance-framework.md).

          Whitelist: MIT, Apache-2.0, BSD 2/3-Clause, ISC, PostgreSQL.
          Copyleft (GPL/AGPL) requires written State Attorney-General approval.

          Stub: today it verifies that dependency manifests present in the repo
          do not declare obviously copyleft licenses, and prints the whitelist
          for audit. Full dependency-graph license resolution is wired to the
          CycloneDX SBOM produced by .github/workflows/sbom.yml (each release
          artifact is scanned before sign-off at FAT/SAT).
          """
          import json
          import re
          import sys
          from pathlib import Path

          WHITELIST = {"MIT", "APACHE-2.0", "BSD-2-CLAUSE", "BSD-3-CLAUSE", "ISC", "POSTGRESQL"}
          COPYLEFT = re.compile(r"\b(GPL|AGPL|LGPL|SSPL|COMMONS CLAUSE)\b", re.IGNORECASE)

          print("license whitelist:", ", ".join(sorted(WHITELIST)))
          violations = []

          for pkg in Path(".").rglob("package.json"):
              if "node_modules" in pkg.parts:
                  continue
              data = json.loads(pkg.read_text())
              lic = str(data.get("license", "")).upper()
              if lic:
                  ok = lic in WHITELIST or lic.startswith(("MIT", "APACHE", "BSD", "ISC"))
                  print(f"{pkg}: {lic} -> {'ok' if ok else 'NOT WHITELISTED'}")
                  if not ok:
                      violations.append(f"{pkg}: {lic}")
                  if COPYLEFT.search(lic):
                      violations.append(f"{pkg}: copyleft license {lic}")

          for lic_file in list(Path(".").glob("LICENSE*")) + list(Path(".").glob("COPYING*")):
              print(f"found license file: {lic_file}")

          if violations:
              print("LICENSE GATE FAILED:")
              [print(" -", v) for v in violations]
              sys.exit(1)
          print("license whitelist gate passed (stub — full SBOM scan at release)")
          PY

  dependency-review:
    name: Dependency review (blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@ce3cf9537a52e8119d91fd484ab5b8a807627bf8 # v4.6.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0, SSPL-1.0

  semgrep:
    name: SAST — Semgrep OWASP ruleset (blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep scan (OWASP Top 10)
        uses: semgrep/semgrep-action@713efdd345b3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  zap-baseline:
    name: OWASP ZAP baseline scan (blocking on High)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start ephemeral compose stack
        run: |
          docker compose -f deploy/docker-compose.yml \
            up -d --build mod-citizen-portal

      - name: Wait for citizen portal health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8011/healthz >/dev/null 2>&1; then
              echo "portal healthy"; exit 0
            fi
            sleep 5
          done
          echo "portal did not become healthy"; exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "http://localhost:8011"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j -m 5 -T 10"
          fail_action: "true"
        env:
          # Exit code 1 on High findings is the ZAP baseline default
          # (action fails the job when alerts at High severity are found).
          ZAP_AUTH_HEADER: ""

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down -v
