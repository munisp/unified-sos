name: sbom

# CycloneDX SBOM generation. Every release ships a signed SBOM
# (CycloneDX v1.5 / SPDX v2.3) per docs/procurement/acceptance-framework.md
# and CONTRIBUTING.md. All actions pinned to full-length commit SHAs.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # required to attach the SBOM to the release

jobs:
  cyclonedx:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" sbom.cyclonedx.json --clobber
