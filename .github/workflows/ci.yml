name: ci

# Continuous integration for the SOS monorepo.
# Gates map to procurement acceptance stages — see README.md in this directory.
# All third-party actions are pinned to full-length commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (ledger/splits + services)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
          cache: true

      - name: Discover Go modules
        id: modules
        run: |
          set -euo pipefail
          mapfile -t mods < <(find ledger services -name go.mod -type f | xargs -r dirname | sort)
          if [ "${#mods[@]}" -eq 0 ]; then
            echo "::error::No Go modules found under ledger/ or services/"
            exit 1
          fi
          printf 'modules=%s\n' "$(printf '%s\n' "${mods[@]}" | jq -R . | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: vet / test / build every Go module
        run: |
          set -euo pipefail
          for mod in $(echo '${{ steps.modules.outputs.modules }}' | jq -r '.[]'); do
            echo "=== $mod ==="
            (cd "$mod" && go vet ./... && go test ./... && go build ./...)
          done

  rust:
    name: Rust (geospatial/geometry-rs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Rust toolchain installed via rustup directly (no third-party action);
      # stable toolchain, minimal profile, deterministic.
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo test (geometry-rs)
        run: |
          set -euo pipefail
          cd geospatial/geometry-rs
          cargo generate-lockfile
          cargo test --locked

  python:
    name: Python (services, edge, geospatial, config + infra validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install test tooling
        run: pip install pytest pytest-cov pyyaml jsonschema

      - name: Validate state policy packs (procurement guardrails)
        run: python3 config/states/validate_packs.py

      - name: Validate infra manifests (tenancy invariants)
        run: python3 infra/tests/validate_infra.py

      - name: Install project Python requirements (if present)
        run: |
          for req in $(find services edge geospatial -maxdepth 2 -name 'requirements*.txt' 2>/dev/null); do
            echo "installing $req"
            pip install -r "$req" || true
          done

      - name: pytest (services, edge, geospatial)
        run: |
          set +e
          pytest services edge geospatial -q
          code=$?
          # pytest exit 5 = no tests collected; not a failure while suites land
          if [ "$code" -eq 5 ]; then echo "no tests collected yet"; exit 0; fi
          exit "$code"

      - name: Per-service coverage gate (>=85%, fail-closed)
        # Mirrors tests/gates/run_gates.py stage1 coverage-gate-85pct: each
        # service's own suite must cover its own package at >=85%.
        run: |
          set -euo pipefail
          rc=0
          for svc in services/*/; do
            if [ -d "$svc/tests" ]; then
              echo "== coverage gate: $svc"
              (cd "$svc" && python3 -m pytest -q --cov=. --cov-fail-under=85 tests) || rc=1
            fi
          done
          exit "$rc"


  e2e:
    name: E2E journeys (Stage 7.B, in-process tier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pyyaml jsonschema \
            fastapi httpx pydantic cryptography typer rich
          for req in $(find services edge geospatial -maxdepth 2 -name 'requirements*.txt' 2>/dev/null); do
            pip install -r "$req" || true
          done

      - name: In-process E2E journey tier (no Docker; always runs)
        run: make test-e2e

      - name: Live stack tier
        if: ${{ vars.E2E_LIVE_STACK == 'true' }}
        run: |
          docker compose -f tests/e2e/docker-compose.integration.yaml up -d --wait
          E2E_STACK=live \
          E2E_PORTAL_BASE_URL=http://localhost:8211 \
          E2E_KYC_BASE_URL=http://localhost:8212 \
          E2E_MARKET_BASE_URL=http://localhost:8213 \
          E2E_TRANSPARENCY_BASE_URL=http://localhost:8215 \
          E2E_CONTROL_PLANE_BASE_URL=http://localhost:8210 \
          pytest tests/e2e -q

  live-deps-compile:
    name: "Live deps compile gate (pinned adapters: pip/go/cargo)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
          cache: true

      # Rust toolchain installed via rustup directly (no third-party action).
      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pinned live deps (constraints-live.txt)
        run: |
          set -euo pipefail
          pip install -r constraints-live.txt
          pip install pydantic  # base import for shared packages

      - name: Verify live adapters import + fail closed
        run: python3 tools/verify_live_deps.py

      - name: go build -tags tigerbeetle (pinned tigerbeetle-go compile check)
        run: |
          set -euo pipefail
          cd ledger/splits
          go mod verify
          go build -tags tigerbeetle ./...
          go vet -tags tigerbeetle ./...

      - name: cargo test --locked (geometry-rs)
        run: |
          set -euo pipefail
          cd geospatial/geometry-rs
          cargo generate-lockfile
          cargo test --locked

  contract-lint:
    name: Contract lint (OpenAPI 3.1 / AsyncAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install contract tooling
        run: pip install pyyaml openapi-spec-validator

      - name: Parse all contract YAML
        run: |
          python3 - <<'PY'
          import sys, glob
          import yaml
          bad = []
          files = sorted(glob.glob("contracts/**/*.yaml", recursive=True))
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as exc:
                  bad.append(f"{f}: {exc}")
          print(f"parsed {len(files)} contract file(s)")
          for b in bad:
              print("FAIL:", b)
          sys.exit(1 if bad else 0)
          PY

      - name: Validate OpenAPI 3.1 specs
        run: |
          python3 - <<'PY'
          import sys, glob
          import yaml
          from openapi_spec_validator import validate
          bad = []
          for f in sorted(glob.glob("contracts/openapi/*.yaml")):
              spec = yaml.safe_load(open(f))
              version = str(spec.get("openapi", ""))
              if not version.startswith("3.1"):
                  bad.append(f"{f}: expected OpenAPI 3.1.x, found {version!r}")
                  continue
              try:
                  validate(spec)
                  print(f"OK: {f} (OpenAPI {version})")
              except Exception as exc:
                  bad.append(f"{f}: {exc}")
          for b in bad:
              print("FAIL:", b)
          sys.exit(1 if bad else 0)
          PY

      - name: Check AsyncAPI envelopes
        run: |
          python3 - <<'PY'
          import sys, glob
          import yaml
          bad = []
          for f in sorted(glob.glob("contracts/asyncapi/*.yaml")):
              doc = yaml.safe_load(open(f))
              if not doc or "asyncapi" not in doc:
                  bad.append(f"{f}: missing asyncapi version key")
              else:
                  print(f"OK: {f} (AsyncAPI {doc['asyncapi']})")
          for b in bad:
              print("FAIL:", b)
          sys.exit(1 if bad else 0)
          PY

  schema-registry:
    name: Schema registry compat (AsyncAPI -> JSON Schema, deterministic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install pyyaml jsonschema pytest

      - name: Committed registry matches generator output (--check)
        run: python3 contracts/asyncapi/registry/generate.py --check

      - name: Generator is byte-idempotent
        run: |
          set -euo pipefail
          before="$(find contracts/asyncapi/registry -type f | sort | xargs sha256sum)"
          python3 contracts/asyncapi/registry/generate.py
          after="$(find contracts/asyncapi/registry -type f | sort | xargs sha256sum)"
          [ "$before" = "$after" ]

      - name: Registry schema tests
        run: pytest tests/contracts -q

  yaml-lint:
    name: YAML lint (workflows, gitops, k8s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Parse all repo YAML surfaces
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import sys, glob
          import yaml
          bad = []
          files = sorted(
              glob.glob(".github/workflows/*.yml", recursive=True)
              + glob.glob("infra/k8s/**/*.yaml", recursive=True)
              + glob.glob("infra/gitops/**/*.yaml", recursive=True)
              + glob.glob("infra/helm/**/*.yaml", recursive=True)
          )
          for f in files:
              if "/templates/" in f or f.endswith(".tpl"):
                  continue  # Helm templates are validated by infra/tests/validate_infra.py
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as exc:
                  bad.append(f"{f}: {exc}")
          print(f"parsed {len(files)} yaml file(s)")
          for b in bad:
              print("FAIL:", b)
          sys.exit(1 if bad else 0)
          PY
