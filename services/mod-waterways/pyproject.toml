[project]
name = "sos-mod-waterways"
version = "0.1.0"
description = "SOS mod-waterways — inland waterways ferry e-ticketing & sand-dredging volumetric monitoring"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
