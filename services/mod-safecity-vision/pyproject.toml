[project]
name = "sos-mod-safecity-vision"
version = "0.1.0"
description = "SOS mod-safecity-vision — Safe-City AI/ML/DL/CV analytics with NDPA biometric authorization gate"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
