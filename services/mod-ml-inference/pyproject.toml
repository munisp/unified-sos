[project]
name = "sos-mod-ml-inference"
version = "0.1.0"
description = "SOS mod-ml-inference — CPU-only ML inference service (fraud_gnn, credit_mlp, luc_avm, crowd_lstm)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
