[project]
name = "sos-control-plane"
version = "0.1.0"
description = "SOS global control plane — tenant provisioning, policy-pack registry, audit events (zero citizen PII)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29"]
live = ["kubernetes==31.0.0", "asyncpg==0.30.0", "boto3==1.35.76", "opensearch-py==2.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
